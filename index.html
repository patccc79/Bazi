<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>子平八字・命理冊頁</title><script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script><style>:root{--paper:#f7f5ef;--card:#fffdf8;--ink:#292722;--muted:#7a766d;--line:#d9d3c7;--indigo:#344b6b;--moss:#6d7a5e;--vermilion:#b85b4b;--ochre:#a77c3c;--water:#0C2C84;--fire:#D60000;--earth:#7B4A12;--metal:#C49A00;--wood:#16803A;--safe:env(safe-area-inset-top,20px);--bottom:env(safe-area-inset-bottom,10px)}body.female{--indigo:#b85c78}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"PingFang TC","PingFang HK",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{width:480px;min-height:100vh;margin:auto;display:flex;flex-direction:column}.nav{padding-top:var(--safe);background:#fbfaf5;border-bottom:1px solid var(--line)}.nav h1{height:44px;margin:0;display:grid;place-items:center;font-family:"PingFang TC","PingFang HK",-apple-system,sans-serif;font-size:20px;font-weight:500;letter-spacing:3px}.nav p{margin:-4px 0 9px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px}.seg{height:36px;margin:10px 16px 8px;display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}.seg button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}.seg button:last-child{border:0}.seg button.active{background:var(--indigo);color:#fff}.page{display:none;padding:7px 18px 30px}.page.active{display:block}.title{margin:22px 1px 7px;color:var(--muted);font-size:12px;letter-spacing:1px}.list,.card{background:var(--card);border:1px solid var(--line);border-radius:3px}.card{padding:13px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:9px 13px;border-bottom:1px solid #e7e2d8;gap:10px}.row:last-child{border:0}.control{display:flex;justify-content:flex-end;flex:1}input,select{max-width:100%;border:0;outline:0;background:transparent;color:var(--indigo);text-align:right;font-size:15px}.hint{margin:8px 1px;color:var(--muted);font-size:12px;line-height:1.6}.btn{width:100%;margin-top:15px;padding:13px;border:0;border-radius:2px;background:var(--indigo);color:#fff;font-weight:700;letter-spacing:1px}.switch{position:relative;width:46px;height:25px}.switch input{opacity:0}.slider{position:absolute;inset:0;background:#c8c4bc;border-radius:20px}.slider:before{content:"";position:absolute;left:2px;top:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}.switch input:checked+.slider{background:var(--moss)}.switch input:checked+.slider:before{transform:translateX(21px)}.tabs{display:flex;margin:18px 0 10px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:9px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:13px}.tabs button.active{border-color:var(--indigo);color:var(--indigo);font-weight:700}.panel{display:none}.panel.active{display:block}.note{margin-bottom:9px;padding:8px 10px;border-left:3px solid var(--indigo);background:#eef1f3;color:#586471;font-size:12px;line-height:1.5}.chart-scroll{overflow:hidden}.heads{display:flex;margin-bottom:5px;color:var(--muted);font-size:12px;text-align:center}.origin-h{flex:4}.trans-h{flex:1;margin-left:4px}.heads small{display:block;font-size:9px;color:#9a958b;margin-top:2px}.board{display:flex;align-items:stretch}.origin{flex:4;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.trans{flex:1;margin-left:4px;border:1px solid var(--line)}.pillar{min-width:0;min-height:222px;border-right:1px solid var(--line);display:flex;flex-direction:column}.pillar:last-child{border:0}.trans .pillar{width:100%;border:0}.p-top{height:101px;padding:9px 5px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}.p-bottom{padding:8px 5px;display:grid;grid-template-columns:1fr;gap:5px}.gan,.zhi,.hgan{font-family:"PingFang TC","PingFang HK",-apple-system,sans-serif;font-weight:600}.gan{font-size:26px;line-height:1.1}.zhi{font-size:25px;line-height:1.1}.hgan{font-size:15px;line-height:1.1}.click{cursor:pointer}.click:active{background:#e5e0d5}.wood{color:var(--wood)}.fire{color:var(--fire)}.earth{color:var(--earth)}.metal{color:var(--metal)}.water{color:var(--water)}.ten{display:inline-flex;align-self:flex-start;width:max-content;max-width:100%;padding:2px 5px;border-radius:2px;font-size:9px;line-height:1.1;color:#fff;letter-spacing:.02em}.ten.bg-metal{color:#322600}.bottom-line{display:flex;align-items:center;justify-content:space-between;gap:3px}.life{font-size:9px;color:var(--muted);white-space:nowrap}.hidden-line{display:flex;align-items:center;justify-content:space-between;gap:3px}.legend{margin:8px 1px;color:var(--muted);font-size:11px;line-height:1.55}.bg-wood{background:var(--wood)}.bg-fire{background:var(--fire)}.bg-earth{background:var(--earth)}.bg-metal{background:var(--metal);color:#322600}.bg-water{background:var(--water)}.dybar{display:flex;gap:7px;overflow-x:auto;padding:5px 0}.dy{flex:0 0 58px;background:#f5f2ea;color:var(--ink);border:1px solid var(--line);padding:6px 2px;text-align:center}.dy.selected,.ln.selected{border:2px solid var(--indigo);background:#edf0f1}.age,.year{font-size:9px;color:#928c80}.gz{display:flex;flex-direction:column;font-family:"PingFang TC","PingFang HK",-apple-system,sans-serif;font-size:20px;font-weight:600;line-height:1.05;margin:3px 0}.lngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ln{min-height:78px;background:#f5f2ea;color:var(--ink);border:1px solid var(--line);padding:5px 2px;text-align:center}.ln.now{background:#fbf2e7}.season{border-color:#d6c49f;background:#fffaf0}.season-gans{font-family:"PingFang TC","PingFang HK",sans-serif;color:#936b2f;font-size:23px;font-weight:600;letter-spacing:4px}.accordion{margin-bottom:9px;border:1px solid var(--line);border-radius:3px;background:var(--card)}.accordion summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 13px;cursor:pointer;color:var(--indigo);font-size:14px;font-weight:650}.accordion summary::-webkit-details-marker{display:none}.accordion summary:after{content:'＋';color:var(--muted);font-size:18px;font-weight:400}.accordion[open] summary:after{content:'−'}.accordion-body{padding:0 13px 13px;border-top:1px solid #e7e2d8}.classic{border-left:3px solid var(--ochre)}.zaohua{border-left:3px solid var(--moss)}.classic-title{margin-top:11px;font-family:"PingFang TC","PingFang HK",sans-serif;font-size:16px;font-weight:650;color:#5c4a2f}.zaohua .classic-title{color:#43553d}.classic-quote{margin-top:8px;font-family:"PingFang TC","PingFang HK",sans-serif;font-size:14px;line-height:1.8;letter-spacing:.2px}.classic-note{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.55}.adv-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #e7e2d8;border-left:1px solid #e7e2d8;margin-top:11px}.adv-grid div{padding:8px;border-right:1px solid #e7e2d8;border-bottom:1px solid #e7e2d8;font-size:12px}.adv-grid span{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}.pair-select{display:grid;grid-template-columns:1fr 1fr;gap:7px;min-width:160px}.pair-select select{text-align:center;background:#faf9f5;border-bottom:1px solid var(--line)}.valid{font-size:10px;margin-left:4px;padding:2px 5px;background:#edf3e8;color:#496642}.invalid{font-size:10px;margin-left:4px;padding:2px 5px;background:#fff0ee;color:#9a4338}.candidate{padding:11px 13px;border-bottom:1px solid #e7e2d8;cursor:pointer}.candidate:last-child{border:0}.candidate:active{background:#eef1f3}.tabbar{margin-top:auto;position:sticky;bottom:0;padding-bottom:var(--bottom);display:flex;background:#fbfaf5;border-top:1px solid var(--line)}.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;font-size:12px}.tabbar button.active{color:var(--indigo)}.err{padding:12px;color:var(--vermilion);text-align:center}</style></head><body><div id="app"><header class="nav"><h1>子平八字</h1><p>命 理 冊 頁</p></header><div class="seg"><button class="active" data-page="forward">出生 → 八字</button><button data-page="reverse">八字 → 出生</button></div><main class="page active" id="forward"><div class="title">出生資料</div><div class="list"><div class="row"><label>性別</label><div class="control"><select id="gender"><option value="1">男</option><option value="0">女</option></select></div></div><div class="row"><label>公曆日期</label><div class="control"><input id="date" type="date" value="1990-01-01"></div></div><div class="row"><label>出生時間</label><div class="control"><input id="time" type="time" value="12:00"></div></div></div><div class="title">真太陽時</div><div class="list"><div class="row"><label>啟用校正</label><div class="control"><label class="switch"><input id="solar" type="checkbox" checked><span class="slider"></span></label></div></div><div class="row"><label>出生地經度（東經＋）</label><div class="control"><input id="lng" type="number" value="114.17" step="0.01" style="width:100px"></div></div><div class="row"><label>常用地點</label><div class="control"><select id="city"><option value="">— 快速套用 —</option><option value="114.17">香港（114.17°E）</option><option value="113.26">廣州（113.26°E）</option><option value="116.40">北京（116.40°E）</option><option value="121.47">上海（121.47°E）</option><option value="121.56">台北（121.56°E）</option><option value="-0.13">倫敦（0.13°W）</option><option value="139.69">東京（139.69°E）</option><option value="-74.01">紐約（74.01°W）</option><option value="-118.24">洛杉磯（118.24°W）</option></select></div></div></div><div class="hint">點天干或任何藏干，可靜默切換十神及十二長生的立極天干。</div><button id="calc" class="btn">排出命盤</button><div id="out"></div></main><main class="page" id="reverse"><div class="title">輸入四柱干支</div><div class="list" id="reverseForm"></div><div class="title">查詢基準年</div><div class="list"><div class="row"><label>基準年</label><div class="control"><input id="base" type="number" value="2026" style="width:90px"></div></div></div><div class="hint">反查範圍為基準年前後300年；每60年分段查找、回驗四柱後去重。</div><button id="search" class="btn">搜尋對應日期</button><div id="revout"></div></main><nav class="tabbar"><button class="active" data-page="forward">排八字</button><button data-page="reverse">反查生辰</button></nav></div><script>(()=>{if(typeof Solar==='undefined'||typeof Lunar==='undefined'){app.innerHTML='<div class="err">lunar-javascript 未能載入，請檢查網絡連線。</div>';return}const G=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],Z=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'],E={甲:'wood',乙:'wood',丙:'fire',丁:'fire',戊:'earth',己:'earth',庚:'metal',辛:'metal',壬:'water',癸:'water'},BE={寅:'wood',卯:'wood',巳:'fire',午:'fire',辰:'earth',戌:'earth',丑:'earth',未:'earth',申:'metal',酉:'metal',亥:'water',子:'water'},Y={甲:1,丙:1,戊:1,庚:1,壬:1},EI={wood:0,fire:1,earth:2,metal:3,water:4},H={子:['癸'],丑:['己','癸','辛'],寅:['甲','丙','戊'],卯:['乙'],辰:['戊','乙','癸'],巳:['丙','戊','庚'],午:['丁','己'],未:['己','丁','乙'],申:['庚','壬','戊'],酉:['辛'],戌:['戊','辛','丁'],亥:['壬','甲']},ST=['長生','沐浴','冠帶','臨官','帝旺','衰','病','死','墓','絕','胎','養'],START={甲:'亥',乙:'亥',丙:'寅',丁:'寅',戊:'寅',己:'寅',庚:'巳',辛:'巳',壬:'申',癸:'申'},DIT={甲:'甲木參天，脫胎要火。春不容金，秋不容土。火熾乘龍，水宕騎虎。地潤天和，植立千古。',乙:'乙木雖柔，刲羊解牛。懷丁抱丙，跨鳳乘猴。虛濕之地，騎馬亦憂。藤蘿繫甲，可春可秋。',丙:'丙火猛烈，欺霜侮雪。能煆庚金，逢辛反怯。土眾成慈，水猖顯節。虎馬犬鄉，甲來成滅。',丁:'丁火柔中，內性昭融。抱乙而孝，合壬而忠。旺而不烈，衰而不窮。如有嫡母，可秋可冬。',戊:'戊土固重，既中且正。靜翕動闢，萬物司命。水潤物生，火燥物病。若在艮坤，怕沖宜靜。',己:'己土卑濕，中正蓄藏。不愁木盛，不畏水狂。火少火晦，金多金光。若要物旺，宜助宜幫。',庚:'庚金帶煞，剛健為最。得水而清，得火而銳。土潤則生，土乾則脆。能贏甲兄，輸於乙妹。',辛:'辛金軟弱，溫潤而清。畏土之疊，樂水之盈。能扶社稷，能救生靈。熱則喜母，寒則喜丁。',壬:'壬水通河，能洩金氣。剛中之德，周流不滯。通根透癸，沖天奔地。化則有情，從則相濟。',癸:'癸水至弱，達於天津。得龍而運，功化斯神。不愁火土，不論庚辛。合戊見火，化象斯真。'},YH={甲:'甲己之年丙作首，乙庚之歲戊為頭；丙辛歲首尋庚起，丁壬壬位順流行；若問戊癸何方發，甲寅之上好追求。',乙:'月令者，天元也。月令用神，為格局綱領。',丙:'月為提綱，先觀月令，再察通關制化。',丁:'日為主，月為提綱；時為輔佐，須兼觀全局。',戊:'以月令為用，兼取透干、通根、制化。',己:'格局以月令為先，日元旺衰須參四柱。',庚:'天干地支得時，則自然開花結子。',辛:'論命先觀月令，次察日主與十神。',壬:'用神以月令為重，通關調候不可偏廢。',癸:'月令定四時之氣，格局取用宜先辨人元。'},QT={甲:'甲木參天，生於春令，先辨寒暖燥濕，再察庚金、丙火、癸水與根氣。',乙:'乙木柔韌，生於四時宜察水火調劑、甲木依附與金之制化。',丙:'丙火重在光輝與調候，生於冬令尤須辨木火扶助與水勢。',丁:'丁火重在柔中昭融，四時先察甲乙根源與壬水制化。',戊:'戊土宜潤不宜燥，四時先辨水火燥濕與木之疏通。',己:'己土卑濕蓄藏，重在火暖、木疏與水土均衡。',庚:'庚金剛健，宜察火煉、水清、土生與木財之取捨。',辛:'辛金溫潤，宜水淘洗、火鍛煉，忌土重埋金。',壬:'壬水通河，先辨源流、堤防、通關與寒暖。',癸:'癸水至弱，先察通根、火土與金水配合。'};let natal,pivot,dy,ln,ec,lu;const call=(o,n,...a)=>{try{return typeof o[n]==='function'?o[n](...a):''}catch{return''}},sc=g=>E[g]||'earth',bc=z=>BE[z]||'earth',bg=g=>'bg-'+sc(g),ss=(d,t)=>{let r=(EI[E[t]]-EI[E[d]]+5)%5,s=!!Y[d]===!!Y[t];return r===0?(s?'比肩':'劫財'):r===1?(s?'食神':'傷官'):r===2?(s?'偏財':'正財'):r===3?(s?'七殺':'正官'):(s?'偏印':'正印')},col=(label,sub,gan,zhi)=>({label,sub,gan,zhi}),stage=(g,z)=>ST[(Z.indexOf(z)-Z.indexOf(START[g])+12)%12];function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>page(x.dataset.page));gender.onchange=()=>document.body.classList.toggle('female',gender.value==='0');city.onchange=e=>{if(e.target.value)lng.value=e.target.value};function pill(c){let h=H[c.zhi]||[];return `<div class="pillar"><div class="p-top"><span class="gan ${sc(c.gan)} click" data-g="${c.gan}">${c.gan}</span><span class="ten ${bg(c.gan)}">${ss(pivot,c.gan)}</span></div><div class="p-bottom"><div class="bottom-line"><span class="zhi ${bc(c.zhi)}">${c.zhi}</span><span class="life">${stage(pivot,c.zhi)}</span></div>${h.map(g=>`<div class="hidden-line"><span class="hgan ${sc(g)} click" data-g="${g}">${g}</span><span class="ten ${bg(g)}">${ss(pivot,g)}</span></div>`).join('')}</div></div>`}function draw(){let n=[natal.time,natal.day,natal.month,natal.year],t=[];if(dy)t.push(dy);if(ln)t.push(ln);chart.innerHTML=`<div class="chart-scroll"><div class="heads"><div class="origin-h">原局</div>${t.map(x=>`<div class="trans-h">${x.label}<small>${x.sub}</small></div>`).join('')}</div><div class="board"><div class="origin">${n.map(pill).join('')}</div>${t.map(x=>`<div class="trans">${pill(x)}</div>`).join('')}</div></div><div class="legend">干支字級已回復原始尺寸；十神維持細小五行色籤。點天干或任何藏干，可靜默切換立極天干。</div>`;document.querySelectorAll('#chart .click').forEach(x=>x.onclick=()=>{pivot=x.dataset.g;draw();renderYun();advanced()})}function mkDY(d,i){let q=call(d,'getGanZhi'),x=col('大運',`${call(d,'getStartYear')}–${call(d,'getEndYear')}`,q[0],q[1]);x.index=i;return x}function renderYun(){let host=document.getElementById('yun');if(!host)return;let ls=ec.getYun(+gender.value).getDaYun(10).filter((x,i)=>i>0&&call(x,'getGanZhi'));host.innerHTML=`<div class="title">大運及流年</div><div class="card"><div class="dybar">${ls.map((d,i)=>{let x=mkDY(d,i);return `<button class="dy ${dy&&dy.index===i?'selected':''}" data-i="${i}"><div class="age">${call(d,'getStartAge')}–${call(d,'getEndAge')}歲</div><div class="gz"><span class="${sc(x.gan)}">${x.gan}</span><span class="${bc(x.zhi)}">${x.zhi}</span></div><div class="year">${x.sub}</div></button>`}).join('')}</div>${dy?`<div class="lngrid">${ls[dy.index].getLiuNian().map(l=>{let q=call(l,'getGanZhi'),x=col('流年',String(call(l,'getYear')),q[0],q[1]);return `<button class="ln ${ln&&ln.sub===x.sub?'selected':''}" data-y="${x.sub}" data-g="${x.gan}" data-z="${x.zhi}"><div class="year">${x.sub}</div><div class="gz"><span class="${sc(x.gan)}">${x.gan}</span><span class="${bc(x.zhi)}">${x.zhi}</span></div><div class="age">${call(l,'getAge')}歲</div></button>`}).join('')}</div>`:''}</div>`;host.querySelectorAll('.dy').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;dy=dy&&dy.index===i?null:mkDY(ls[i],i);ln=null;draw();renderYun();advanced()});host.querySelectorAll('.ln').forEach(b=>b.onclick=()=>{ln=ln&&ln.sub===b.dataset.y?null:col('流年',b.dataset.y,b.dataset.g,b.dataset.z);draw();renderYun();advanced()})}function acc(title,body,cls='',open=''){return `<details class="accordion ${cls}" ${open}><summary>${title}</summary><div class="accordion-body">${body}</div></details>`}
