*{box-sizing:border-box}html,body{margin:0;color:var(--ink);font-family:"PingFang HK","PingFang TC",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background-color:var(--paper);background-image:radial-gradient(rgba(65,55,42,.025) .5px,transparent .5px);background-size:5px 5px}button,input,select{font:inherit}button{cursor:pointer}#app{width:480px;min-height:100vh;margin:auto;background:rgba(247,245,239,.92);display:flex;flex-direction:column}.nav{padding-top:var(--safe);background:rgba(252,251,247,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav h1{height:46px;margin:0;display:grid;place-items:center;font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:21px;font-weight:500;letter-spacing:5px}.nav p{margin:-5px 0 11px;text-align:center;color:#938b7e;font-size:10px;letter-spacing:2px}.seg{height:34px;margin:11px 20px 12px;display:flex;border-bottom:1px solid var(--line)}.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:13px;letter-spacing:.08em}.seg button.active{color:var(--indigo);font-weight:650;border-bottom:2px solid var(--indigo)}.page{display:none;padding:10px 22px 42px}.page.active{display:block}.kicker{margin-top:34px;color:#958d80;font-size:10px;letter-spacing:.16em}.kicker:first-child{margin-top:10px}.form-sheet{margin-top:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:rgba(255,253,248,.65)}.row{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:9px 3px;border-bottom:1px solid var(--line-soft);gap:12px}.row:last-child{border:0}.control{display:flex;justify-content:flex-end;flex:1}input,select{max-width:100%;border:0;outline:0;background:transparent;color:var(--indigo);text-align:right;font-size:15px}.hint{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.65}.btn{width:100%;margin-top:23px;padding:13px;border:0;background:var(--indigo);color:#fff;font-size:14px;font-weight:650;letter-spacing:.16em}.switch{position:relative;width:45px;height:24px}.switch input{opacity:0}.slider{position:absolute;inset:0;background:#cbc6bc;border-radius:20px}.slider:before{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:var(--moss)}.switch input:checked+.slider:before{transform:translateX(21px)}.tabs{display:flex;margin:34px 0 16px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:8px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:13px;letter-spacing:.08em}.tabs button.active{border-color:var(--indigo);color:var(--indigo);font-weight:650}.panel{display:none}.panel.active{display:block}.intro{margin:0 0 22px;padding:10px 12px;border-left:2px solid var(--indigo);color:#5f6d79;background:rgba(238,241,243,.55);font-size:12px;line-height:1.65}
/* 命盤 */.folio-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 10px;color:#5f594f;font-family:"Noto Serif TC","Songti TC",serif;font-size:16px}.folio-title:after{content:"";height:1px;background:var(--line);flex:1;margin-left:12px}.chart-scroll{overflow:hidden}.heads{display:flex;margin-bottom:5px;color:#8c8478;font-size:11px;text-align:center}.origin-h{flex:4}.trans-h{flex:1;margin-left:4px}.heads small{display:block;font-size:8px;color:#aaa194;margin-top:2px}.board{display:flex;align-items:stretch}.origin{flex:4;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.trans{flex:1;margin-left:4px;border:1px solid var(--line)}.pillar{min-width:0;min-height:226px;border-right:1px solid var(--line);display:flex;flex-direction:column}.pillar:last-child{border:0}.trans .pillar{width:100%;border:0}.p-top{height:101px;padding:9px 4px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 29px}.gan{font-family:"Noto Serif TC","Songti TC",serif;font-size:26px;font-weight:550;line-height:1.1;padding:1px 2px}.ten{align-self:start;font-size:10px;line-height:1.2;text-align:center;padding:3px 1px;min-height:20px;color:#fff;border-left:2px solid rgba(0,0,0,.13)}.bg-wood{background:var(--wood)}.bg-fire{background:var(--fire)}.bg-earth{background:var(--earth)}.bg-metal{background:var(--metal);color:#332600}.bg-water{background:var(--water)}.p-bottom{padding:8px 4px;display:grid;grid-template-columns:1fr 29px;gap:4px 2px;align-content:start}.zhi{font-family:"Noto Serif TC","Songti TC",serif;font-size:25px;font-weight:550;line-height:1.1;padding:1px 2px}.life{font-size:9px;color:#8b8274;padding-top:4px;text-align:center}.hiddens,.h-tens{display:flex;flex-direction:column;gap:3px}.hgan{font-family:"Noto Serif TC","Songti TC",serif;font-size:14px;line-height:1.1;padding:1px 2px;width:max-content}.h-tens span{font-size:9px;padding:2px 1px;color:#fff;text-align:center;min-height:17px}.h-tens .bg-metal{color:#332600}.click{cursor:pointer}.click:active{background:#e4dfd5}.wood{color:var(--wood)}.fire{color:var(--fire)}.earth{color:var(--earth)}.metal{color:var(--metal)}.water{color:var(--water)}.legend{margin:10px 1px 0;color:#8c8478;font-size:10px;line-height:1.6}.columns-5 .heads{font-size:10px}.columns-5 .trans-h,.columns-5 .trans{margin-left:3px}.columns-5 .p-top{height:93px;padding:6px 3px;grid-template-columns:1fr 26px}.columns-5 .p-bottom{padding:6px 3px;grid-template-columns:1fr 26px;gap:3px 1px}.columns-5 .pillar{min-height:205px}.columns-5 .gan{font-size:23px}.columns-5 .zhi{font-size:22px}.columns-5 .ten{font-size:9px}.columns-5 .hgan{font-size:13px}.columns-5 .h-tens span{font-size:8px;min-height:16px}.columns-5 .life{font-size:8px}.columns-6 .heads{font-size:9px}.columns-6 .heads small{font-size:7px}.columns-6 .trans-h,.columns-6 .trans{margin-left:2px}.columns-6 .p-top{height:86px;padding:5px 2px;grid-template-columns:1fr 22px}.columns-6 .p-bottom{padding:5px 2px;grid-template-columns:1fr 22px;gap:2px 1px}.columns-6 .pillar{min-height:190px}.columns-6 .gan,.columns-6 .zhi{font-size:20px}.columns-6 .ten{font-size:7px;min-height:18px}.columns-6 .hgan{font-size:11px}.columns-6 .h-tens{gap:2px}.columns-6 .h-tens span{font-size:7px;min-height:14px;padding:1px 0}.columns-6 .life{font-size:7px}
/* 紙頁分隔與歲運 */.dybar{display:flex;gap:7px;overflow-x:auto;padding:3px 0 8px}.dy{flex:0 0 58px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 2px;text-align:center}.dy.selected,.ln.selected{border:2px solid var(--indigo);background:#f0f3f3}.age,.year{font-size:9px;color:#948c7f}.gz{display:flex;flex-direction:column;font-family:"Noto Serif TC","Songti TC",serif;font-size:19px;font-weight:550;line-height:1.05;margin:3px 0}.lngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ln{min-height:76px;background:transparent;color:var(--ink);border:1px solid var(--line);padding:5px 2px;text-align:center}.ln.now{background:#fbf4e9}.quiet-box{margin-top:26px;padding-top:12px;border-top:1px solid var(--line)}.quiet-label{font-size:11px;color:#82796d;letter-spacing:.12em}.info-line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:13px}.info-line:last-child{border:0}.info-line span:first-child{color:var(--muted)}.info-line span:last-child{font-weight:550;text-align:right}.badge{margin-left:5px;padding:2px 5px;background:#efe3c7;color:#806330;font-size:10px}.season{margin-top:10px;padding:13px;border-left:2px solid var(--ochre);background:#fffaf0}.season-gans{font-family:"Noto Serif TC","Songti TC",serif;color:#936b2f;font-size:24px;font-weight:550;letter-spacing:5px}.jq{padding:11px 2px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between}.jq:last-child{border:0}.jq-date{font-size:12px;color:var(--muted)}
/* 古籍摺頁 */.accordion{border-top:1px solid var(--line)}.acc-item{border-bottom:1px solid var(--line)}.acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border:0;background:transparent;color:var(--ink);text-align:left}.acc-head .label{font-family:"Noto Serif TC","Songti TC",serif;font-size:15px}.acc-head .mark{font-size:13px;color:var(--muted);transition:transform .2s}.acc-item.open .mark{transform:rotate(45deg)}.acc-body{display:none;padding:4px 4px 20px}.acc-item.open .acc-body{display:block}.classic-quote{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-size:16px;line-height:2;letter-spacing:.07em;color:#3d3830}.source{margin-top:12px;color:#938a7e;font-size:10px;letter-spacing:.12em}.comment{margin-top:11px;padding:8px 10px;background:#f1f3f1;color:#596456;font-size:12px;line-height:1.6}.symbol-item{padding:11px 0;border-bottom:1px solid var(--line-soft)}.symbol-item:last-child{border:0}.symbol-main{font-family:"Noto Serif TC","Songti TC",serif;font-size:17px;font-weight:550}.symbol-note{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.5}.filled,.virtual{display:inline-block;margin-left:5px;padding:1px 5px;font-size:10px}.filled{background:#eee9dc;color:#756d5e}.virtual{background:#eef1f3;color:#52657c}.tabbar{margin-top:auto;position:sticky;bottom:0;padding-bottom:var(--bottom);display:flex;background:rgba(251,250,245,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;font-size:12px}.tabbar button.active{color:var(--indigo)}.err{padding:12px;color:var(--vermilion);text-align:center}
body.theme-female{--indigo:#b85c78}body.theme-female .intro{color:#825664;background:#f9eef1}body.theme-female .dy.selected,body.theme-female .ln.selected{background:#f9f0f3}body.theme-female .trans{border-color:#c97691;background:#f9f0f3}.jq.click{cursor:pointer}.jq.click:active{background:rgba(0,0,0,.03)}.rel-box{margin-top:9px;padding:9px 10px;border-left:2px solid var(--ochre);background:#fffaf0;font-size:12px;line-height:1.7}.rel-tag{display:inline-block;margin:2px 4px 2px 0;padding:1px 6px;border-radius:2px;font-size:11px}.rel-chong{background:#fbe4e0;color:#96392c}.rel-he{background:#e6f0e3;color:#3d6b34}.rel-xing{background:#f2e6d8;color:#8a5a25}.rel-hai{background:#e6e9f2;color:#3c4f8a}.rel-sanhe{background:#dff1ee;color:#1f6e63}</style>

<body>
<div id="app">
<header class="nav"><h1>子平八字</h1><p>命 理 冊 頁</p></header>
<div class="seg"><button class="active" data-page="forward">出生 → 八字</button><button data-page="reverse">八字 → 出生</button></div>
<main class="page active" id="forward">
<div class="kicker">BIRTH RECORD</div>
<div class="form-sheet"><div class="row"><label>性別</label><div class="control"><select id="gender"><option value="1">男</option><option value="0">女</option></select></div></div><div class="row"><label>公曆日期</label><div class="control"><input id="date" type="date" value="1990-01-01"></div></div><div class="row"><label>出生時間</label><div class="control"><input id="time" type="time" value="12:00"></div></div></div>
<div class="kicker">TRUE SOLAR TIME</div>
<div class="form-sheet"><div class="row"><label>啟用校正</label><div class="control"><label class="switch"><input id="solar" type="checkbox" checked><span class="slider"></span></label></div></div><div class="row"><label>出生地經度（東經＋）</label><div class="control"><input id="lng" type="number" value="114.17" step="0.01" style="width:100px"></div></div><div class="row"><label>常用地點</label><div class="control"><select id="city"><option value="">— 快速套用 —</option><option value="114.17">香港</option><option value="113.26">廣州</option><option value="116.40">北京</option><option value="121.47">上海</option><option value="121.56">台北</option></select></div></div></div>
<div class="hint">點天干或任何藏干，可靜默切換十神及十二長生的立極天干。</div><button id="calc" class="btn">開啟命盤</button><div id="out"></div>
</main>
<main class="page" id="reverse"><div class="kicker">REVERSE LOOKUP</div><div class="hint">年、月、日、時柱請分別選擇天干與地支，系統會即時檢查配對是否合法。</div><div class="form-sheet" id="reverseForm"></div><div class="form-sheet"><div class="row"><label>查詢基準年</label><div class="control"><input id="base" type="number" value="2026" style="width:90px"></div></div></div><button id="search" class="btn">搜尋對應日期</button><div id="revout"></div></main>
<nav class="tabbar"><button class="active" data-page="forward">命盤</button><button data-page="reverse">反查</button></nav>
</div>
<script>
(()=>{
if(typeof Solar==='undefined'||typeof Lunar==='undefined'){document.getElementById('app').innerHTML='<div class="err">lunar-javascript 未能載入，請檢查網絡連線。</div>';return}
const G=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const Z=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GZ=Array.from({length:60},(_,i)=>G[i%10]+Z[i%12]);
const STEM_ELEMENT={'甲':'wood','乙':'wood','丙':'fire','丁':'fire','戊':'earth','己':'earth','庚':'metal','辛':'metal','壬':'water','癸':'water'};
const BRANCH_ELEMENT={'寅':'wood','卯':'wood','巳':'fire','午':'fire','辰':'earth','戌':'earth','丑':'earth','未':'earth','申':'metal','酉':'metal','亥':'water','子':'water'};
const YANG={'甲':1,'丙':1,'戊':1,'庚':1,'壬':1};
const EI={wood:0,fire:1,earth:2,metal:3,water:4};
const HIDE={'子':['癸'],'丑':['己','癸','辛'],'寅':['甲','丙','戊'],'卯':['乙'],'辰':['戊','乙','癸'],'巳':['丙','戊','庚'],'午':['丁','己'],'未':['己','丁','乙'],'申':['庚','壬','戊'],'酉':['辛'],'戌':['戊','辛','丁'],'亥':['壬','甲']};
const STEM_COMBOS=[{gans:['甲','己'],out:'戊土'},{gans:['乙','庚'],out:'庚金'},{gans:['丙','辛'],out:'壬水'},{gans:['丁','壬'],out:'甲木'},{gans:['戊','癸'],out:'丙火'}];
const DARK_ARCH=[{pair:['子','寅'],result:'丑',type:'夾拱／金庫',adjacent:true},{pair:['卯','巳'],result:'辰',type:'夾拱／水庫',adjacent:true},{pair:['午','申'],result:'未',type:'夾拱／木庫',adjacent:true},{pair:['酉','亥'],result:'戌',type:'夾拱／火庫',adjacent:true},{pair:['申','辰'],result:'子',type:'三合拱水',adjacent:false},{pair:['寅','戌'],result:'午',type:'三合拱火',adjacent:false},{pair:['亥','未'],result:'卯',type:'三合拱木',adjacent:false},{pair:['巳','丑'],result:'酉',type:'三合拱金',adjacent:false}];
const CHANG_STAGES=['長生','沐浴','冠帶','臨官','帝旺','衰','病','死','墓','絕','胎','養'];
const YANG_START={甲:'亥',乙:'亥',丙:'寅',丁:'寅',戊:'寅',己:'寅',庚:'巳',辛:'巳',壬:'申',癸:'申'};
const DITIANSUI={甲:'甲木參天，脫胎要火。春不容金，秋不容土；火熾乘龍，水蕩騎虎，地潤天和，植立千古。',乙:'乙木雖柔，刲羊解牛。懷丁抱丙，跨鳳乘猴；虛濕之地，騎馬亦憂；藤蘿繫甲，可春可秋。',丙:'丙火猛烈，欺霜侮雪。能煅庚金，逢辛反怯；土眾成慈，水猖顯節；虎馬犬鄉，甲來成滅。',丁:'丁火柔中，內性昭融。抱乙而孝，合壬而忠；旺而不烈，衰而不窮；如有嫡母，可秋可冬。',戊:'戊土固重，既中且正。靜翕動闢，萬物司命；水潤物生，火燥物病；若在艮坤，怕沖宜靜。',己:'己土卑濕，中正蓄藏。不愁木盛，不畏水狂；火少火晦，金多金光；若要物旺，宜助宜幫。',庚:'庚金帶煞，剛健為最。得水而清，得火而銳；土潤則生，土乾則脆；能贏甲兄，輸於乙妹。',辛:'辛金軟弱，溫潤而清。畏土之疊，樂水之盈；能扶社稷，能救生靈；熱則喜母，寒則喜丁。',壬:'壬水通河，能洩金氣。剛中之德，周流不滯；通根透癸，沖天奔地；化則有情，從則相濟。',癸:'癸水至弱，達於天津。得龍而運，功化斯神；不愁火土，不論庚辛；合戊見火，化象斯真。'};
const YUANHAI={甲:'甲木天干作首排，原無枝葉與根荄；欲存天地千年久，直向沙泥萬丈埋。斫就棟樑金得用，化成灰炭火為災；蠢然塊物無機事，一任春秋自往來。',乙:'乙木根荄種得深，只宜陽地不宜陰；漂浮最怕多逢水，刻斫何須苦用金。南去火炎災不淺，西行土重禍猶侵；棟樑不是連根木，辨別工夫好用心。',丙:'丙火明明一太陽，原從正大立綱常；洪光不獨窺千里，巨焰猶能遍八荒。出世肯為浮木子，傳生不作濕泥娘；江湖死水安能克，惟怕成林木作殃。',丁:'丁火其形一燭燈，太陽相見奪光明；得時能鑄千斤鐵，失令難熔一寸金。雖少乾柴猶可引，縱多濕木不能生；乙木相生殊可喜，壬來相合最為清。',戊:'戊土城牆堤岸同，鎮江河海要根重；柱中帶合還須正，日下乘虛忌落空。水盛卻宜高堤防，火炎猶喜水相逢；若還獨坐財官旺，福祿榮華莫與同。',己:'己土田園屬四維，坤深萬物為之基；水金火木皆為喜，若在艮坤怕有虧。無根之土終難立，帶水之泥始有機；火少火多還有用，金多金少最相宜。',庚:'庚金頑鈍性偏剛，火制功成怕水鄉；夏日不宜逢水盛，冬天最愛見丙丁。能輸甲木成才器，能合乙木見義情；柱中若得根深厚，名利雙全祿位昌。',辛:'辛金珠玉性通靈，最愛陽和沙水清；成就不勞炎火煅，資扶偏喜濕泥生。木多火旺宜西北，水冷金寒要丙丁；坐祿通根身旺地，何愁富貴不光榮。',壬:'壬水汪洋並百川，漫流天下總無邊；干支多聚成漂蕩，火土重逢涸本源。養性結胎須未午，長生化祿屬申乾；能生大木還宜甲，化殺生權在火天。',癸:'癸水應非雨露謂，根通亥子即江河；柱無坤坎身還弱，局有財官不尚多。申子辰全成上格，寅卯東方遇不和；假饒火土生深夏，西北行程豈太過。'};
const ZAOHUA_WUXING={wood:'木性騰上而無所止，氣重則欲金任使；木有金，則有惟高惟斂之德。木賴水生，水盛而木則漂流；木欲火發，火多而木則焚燼。',fire:'火性炎上，遇木則明，遇水則滅；得土而晦，得金而熄。火旺宜水濟，火弱喜木生，調候須辨寒暖燥濕。',earth:'土居四維，為五行之樞紐。土賴火暖，得水潤而生；土重宜木疏，土虛喜火土扶持。寒濕先火，燥烈先水。',metal:'金性剛健，賴土生扶，得水淘洗，逢火煅鍊。金剛宜火制，金寒喜火暖；土重恐埋，水多則沉。',water:'水性潤下，通河達海。水旺喜土堤防，水寒喜火溫暖，水涸喜金生源；得木則洩秀，過盛則泛濫。'};
const ZAOHUA_STEM={甲:'甲木為陽木，如喬木棟樑，體剛性直。宜根深土厚，得火發榮；木旺宜金斫削，寒木首重丙火溫養。',乙:'乙木為陰木，如花草藤蘿，性柔而有依。宜陽和水潤，得甲可攀；水多則漂，金重則傷，火炎土燥亦須調劑。',丙:'丙火為陽火，如太陽之光，性剛烈而普照。宜壬水輔映，甲木生扶；火盛須水濟，火弱喜木助。',丁:'丁火為陰火，如燈燭爐火，柔中而有昭融。喜甲乙引助，壬水相合；寒局喜木火，火盛仍須水土調和。',戊:'戊土為陽土，如城牆堤岸，重厚而能制水。宜丙火暖，甲木疏；土燥喜水，土濕喜火，土重不可壅塞。',己:'己土為陰土，如田園沃壤，卑濕而能蓄藏。喜丙火暖土，甲木疏通；水盛土虛，火多土焦，皆須中和。',庚:'庚金為陽金，如頑鐵利器，剛健而宜鍛鍊。喜丙丁火煅，壬癸水清，戊己土生；金寒尤重火暖。',辛:'辛金為陰金，如珠玉金銀，溫潤而清。喜壬水淘洗，戊土生扶，丙火暖局；土重易埋，火烈易熔。',壬:'壬水為陽水，如江河大川，周流而不滯。喜戊土堤防，丙火暖局，庚金發源；水旺亦喜木洩其秀。',癸:'癸水為陰水，如雨露泉源，柔弱而能潤物。喜丙火暖，庚辛金生，戊土制；水寒土濕，首重火土相濟。'};
let natal=null,pivot=null,dy=null,ln=null,ec=null;
const call=(o,n,...a)=>{try{return typeof o[n]==='function'?o[n](...a):''}catch{return''}};
function stemClass(g){return STEM_ELEMENT[g]||'earth'}
function branchClass(z){return BRANCH_ELEMENT[z]||'earth'}
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}

function syncGenderTheme(){document.body.classList.toggle('theme-female',document.getElementById('gender').value==='0')}
document.getElementById('gender').addEventListener('change',syncGenderTheme);syncGenderTheme();
document.getElementById('city').onchange=e=>{if(e.target.value)document.getElementById('lng').value=e.target.value};
function ss(day,target){const r=(EI[STEM_ELEMENT[target]]-EI[STEM_ELEMENT[day]]+5)%5,s=!!YANG[day]===!!YANG[target];return r===0?(s?'比肩':'劫財'):r===1?(s?'食神':'傷官'):r===2?(s?'偏財':'正財'):r===3?(s?'七殺':'正官'):(s?'偏印':'正印')}
function bgByGan(gan){return 'bg-'+(STEM_ELEMENT[gan]||'earth')}
function hg(z){return HIDE[z]||[]}
function lifeStage(gan,zhi){const start=Z.indexOf(YANG_START[gan]);const at=Z.indexOf(zhi);return CHANG_STAGES[(at-start+12)%12]}
function col(label,sub,gan,zhi){return{label,sub,gan,zhi}}
function pillar(c){const h=hg(c.zhi),t=ss(pivot,c.gan);return `<div class="pillar"><div class="p-top"><span class="gan ${stemClass(c.gan)} click" data-g="${c.gan}">${c.gan}</span><span class="ten ${bgByGan(c.gan)}">${t}</span></div><div class="p-bottom"><span class="zhi ${branchClass(c.zhi)}">${c.zhi}</span><span class="life">${lifeStage(pivot,c.zhi)}</span><div class="hiddens">${h.map(g=>`<span class="hgan ${stemClass(g)} click" data-g="${g}">${g}</span>`).join('')}</div><div class="h-tens">${h.map(g=>`<span class="${bgByGan(g)}">${ss(pivot,g)}</span>`).join('')}</div></div></div>`}
function allColumns(){const a=[natal.time,natal.day,natal.month,natal.year];if(dy)a.push(dy);if(ln)a.push(ln);return a}
function renderTopCombos(){if(!natal)return'';const cols=allColumns(),hits=[];for(const r of STEM_COMBOS){const a=cols.filter(c=>c.gan===r.gans[0]),b=cols.filter(c=>c.gan===r.gans[1]);if(a.length&&b.length)hits.push({r,s:[...a,...b]})}if(!hits.length)return'';return `<div class="folio-title">天干五合（候選）</div><div class="quiet-box">${hits.map(x=>`<div class="symbol-item"><div class="symbol-main">${x.r.gans.join('＋')}　→　${x.r.out}</div><div class="symbol-note">來源：${x.s.map(c=>c.label+'天干（'+c.gan+'）').join('、')}。<span class="virtual">陽干化象候選</span></div></div>`).join('')}</div>`}

const ZHI_CHONG={子:'午',丑:'未',寅:'申',卯:'酉',辰:'戌',巳:'亥',午:'子',未:'丑',申:'寅',酉:'卯',戌:'辰',亥:'巳'};
const ZHI_HE6={子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
const ZHI_HAI={子:'未',未:'子',丑:'午',午:'丑',寅:'巳',巳:'寅',卯:'辰',辰:'卯',申:'亥',亥:'申',酉:'戌',戌:'酉'};
const SANHE_GROUPS=[{zhis:['申','子','辰'],element:'水'},{zhis:['亥','卯','未'],element:'木'},{zhis:['寅','午','戌'],element:'火'},{zhis:['巳','酉','丑'],element:'金'}];
const XING_GROUPS=[{type:'無禮之刑',pairs:[['子','卯']]},{type:'恃勢之刑',pairs:[['寅','巳'],['巳','申'],['申','寅']]},{type:'恩義之刑',pairs:[['丑','戌'],['戌','未'],['未','丑']]},{type:'自刑',pairs:[['辰','辰'],['午','午'],['酉','酉'],['亥','亥']]}];
const GAN_HE5={甲:['己','土'],己:['甲','土'],乙:['庚','金'],庚:['乙','金'],丙:['辛','水'],辛:['丙','水'],丁:['壬','木'],壬:['丁','木'],戊:['癸','火'],癸:['戊','火']};
function ganRelations(gans){const out=[],seen=new Set();for(let i=0;i<gans.length;i++)for(let j=i+1;j<gans.length;j++){const a=gans[i],b=gans[j];if(a.g===b.g)continue;const pair=GAN_HE5[a.g];if(pair&&pair[0]===b.g){const key=[a.label,b.label].sort().join('|');if(seen.has(key))continue;seen.add(key);out.push({type:'合',cls:'rel-he',text:`${a.label}${a.g}與${b.label}${b.g}合化${pair[1]}`})}}return out}
function zhiRelations(items){const out=[],seen=new Set();
 function mark(key,obj){if(seen.has(key))return;seen.add(key);out.push(obj)}
 for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
  const a=items[i],b=items[j];if(a===b)continue;
  if(ZHI_CHONG[a.z]===b.z)mark(['沖',a.label,b.label].join('|'),{type:'沖',cls:'rel-chong',text:`${a.label}${a.z}與${b.label}${b.z}相沖`});
  if(ZHI_HE6[a.z]===b.z)mark(['合',a.label,b.label].join('|'),{type:'合',cls:'rel-he',text:`${a.label}${a.z}與${b.label}${b.z}六合`});
  if(ZHI_HAI[a.z]===b.z)mark(['害',a.label,b.label].join('|'),{type:'害',cls:'rel-hai',text:`${a.label}${a.z}與${b.label}${b.z}相害`});
  for(const g of XING_GROUPS)for(const [x,y] of g.pairs){
   if((a.z===x&&b.z===y)||(a.z===y&&b.z===x)){
    if(g.type==='自刑'&&a.z!==b.z)continue;
    mark(['刑',g.type,a.label,b.label].join('|'),{type:'刑',cls:'rel-xing',text:`${a.label}${a.z}與${b.label}${b.z}相刑（${g.type}）`});
   }
  }
 }
 for(const grp of SANHE_GROUPS){
  const present=items.filter(x=>grp.zhis.includes(x.z));
  const distinctZhi=[...new Set(present.map(x=>x.z))];
  if(distinctZhi.length>=3){
   const labels=present.filter(p=>grp.zhis.includes(p.z)).map(p=>`${p.label}${p.z}`).join('、');
   mark(['三合',grp.zhis.join('')].join('|'),{type:'三合',cls:'rel-sanhe',text:`${labels}三合${grp.element}局`});
  }else if(distinctZhi.length===2){
   const labels=present.filter(p=>grp.zhis.includes(p.z)).map(p=>`${p.label}${p.z}`).join('、');
   mark(['半合',grp.zhis.join(''),labels].join('|'),{type:'半合',cls:'rel-sanhe',text:`${labels}半合${grp.element}局`});
  }
 }
 return out;
}
function renderRelations(extra){
 const base=[{label:'年',g:natal.year.gan,z:natal.year.zhi},{label:'月',g:natal.month.gan,z:natal.month.zhi},{label:'日',g:natal.day.gan,z:natal.day.zhi},{label:'時',g:natal.time.gan,z:natal.time.zhi}];
 const baseGanRel=ganRelations(base),baseZhiRel=zhiRelations(base);
 let html=`<div class="rel-box"><b>原局四柱關係</b><br>${[...baseGanRel,...baseZhiRel].map(r=>`<span class="rel-tag ${r.cls}">${r.text}</span>`).join('')||'<span class="hint" style="display:inline">原局四柱之間未見明顯沖合刑害。</span>'}</div>`;
 if(extra){
  const withExtra=[...base,extra];
  const extraGanRel=ganRelations(withExtra).filter(r=>r.text.includes(extra.label));
  const extraZhiRel=zhiRelations(withExtra).filter(r=>r.text.includes(extra.label));
  const combined=[...extraGanRel,...extraZhiRel];
  html+=`<div class="rel-box"><b>${extra.label}與原局四柱關係</b><br>${combined.map(r=>`<span class="rel-tag ${r.cls}">${r.text}</span>`).join('')||'<span class="hint" style="display:inline">未見明顯沖合刑害。</span>'}</div>`;
 }
 return html;
}
function draw(){if(!natal)return;const n=[natal.time,natal.day,natal.month,natal.year],t=[];if(dy)t.push(dy);if(ln)t.push(ln);const count=4+t.length;document.getElementById('chart').innerHTML=`${renderTopCombos()}<div class="chart-scroll"><div class="chart-scale columns-${count}"><div class="heads"><div class="origin-h">原局</div>${t.map(x=>`<div class="trans-h">${x.label}<small>${x.sub}</small></div>`).join('')}</div><div class="board"><div class="origin">${n.map(pillar).join('')}</div>${t.map(x=>`<div class="trans">${pillar(x)}</div>`).join('')}</div></div></div><div class="legend">${count===4?'原局四柱。':count===5?'原局與大運，五柱自動縮放。':'原局、大運與流年，六柱自動縮放。'} 點天干或任何藏干，即以它作立極點重算全盤十神與十二長生。</div>${renderRelations(ln?{label:'流年',g:ln.gan,z:ln.zhi}:dy?{label:'大運',g:dy.gan,z:dy.zhi}:null)}`;document.querySelectorAll('#chart .click').forEach(e=>e.onclick=()=>{pivot=e.dataset.g;draw();renderYun();renderAdvanced()})}
function mkDY(d,i){const q=call(d,'getGanZhi');const x=col('大運',`${call(d,'getStartYear')}–${call(d,'getEndYear')}`,q[0],q[1]);x.index=i;return x}
function mkLN(l){const q=call(l,'getGanZhi');return col('流年',String(call(l,'getYear')),q[0],q[1])}
function renderYun(){if(!ec)return;const e=document.getElementById('yun');if(!e)return;const yun=ec.getYun(+document.getElementById('gender').value);const ls=yun.getDaYun(10).filter((d,i)=>i>0&&call(d,'getGanZhi'));
const chips=ls.map((d,i)=>{const x=mkDY(d,i),a=call(d,'getStartAge'),b=call(d,'getEndAge');return `<button class="dy ${dy&&dy.index===i?'selected':''}" data-i="${i}"><div class="age">${a}–${b}歲</div><div class="gz"><span class="${stemClass(x.gan)}">${x.gan}</span><span class="${branchClass(x.zhi)}">${x.zhi}</span></div><div class="year">${x.sub}</div></button>`}).join('');
let panel='';if(dy){const d=ls[dy.index],a=d.getLiuNian().map(l=>{const x=mkLN(l),now=x.sub==new Date().getFullYear();return `<button class="ln ${ln&&ln.sub===x.sub?'selected':''} ${now?'now':''}" data-y="${x.sub}" data-g="${x.gan}" data-z="${x.zhi}"><div class="year">${x.sub}</div><div class="gz"><span class="${stemClass(x.gan)}">${x.gan}</span><span class="${branchClass(x.zhi)}">${x.zhi}</span></div><div class="age">${call(l,'getAge')}歲</div></button>`}).join('');panel=`<div class="folio-title">流年・${dy.gan}${dy.zhi}大運</div><div class="lngrid">${a}</div>`}
e.innerHTML=`<div class="folio-title">大運及流年</div><div class="hint">第一步大運按月柱、性別及陰陽順逆推算；已隱藏起運前 Undefined 佔位項目。</div><div class="dybar">${chips}</div>${panel}`;
e.querySelectorAll('.dy').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(dy&&dy.index===i){dy=null;ln=null}else{dy=mkDY(ls[i],i);ln=null}draw();renderYun();renderAdvanced()});e.querySelectorAll('.ln').forEach(b=>b.onclick=()=>{if(ln&&ln.sub===b.dataset.y)ln=null;else ln=col('流年',b.dataset.y,b.dataset.g,b.dataset.z);draw();renderYun();renderAdvanced()})}
function accordion(title,content,open=false){return `<div class="acc-item ${open?'open':''}"><button class="acc-head"><span class="label">${title}</span><span class="mark">＋</span></button><div class="acc-body">${content}</div></div>`}
function classicContent(quote,source,note){return `<div class="classic-quote">${quote}</div><div class="source">── ${source}</div><div class="comment">${note}</div>`}
function renderDarkArch(){const cols=allColumns(),branches=cols.map((c,i)=>({i,label:c.label,zhi:c.zhi})),hits=[];for(const r of DARK_ARCH){const a=branches.filter(x=>x.zhi===r.pair[0]),b=branches.filter(x=>x.zhi===r.pair[1]);let p=[];for(const x of a)for(const y of b){if(!r.adjacent||Math.abs(x.i-y.i)===1)p.push([x,y])}if(p.length)hits.push({r,p,filled:branches.some(x=>x.zhi===r.result)})}return hits.length?hits.map(x=>`<div class="symbol-item"><div class="symbol-main">${x.r.pair.join('、')}　→　${x.r.result}</div><div class="symbol-note">來源：${x.p.map(p=>p[0].label+'支、'+p[1].label+'支').join('；')}。類型：${x.r.type}。${x.filled?'<span class="filled">被拱地支已填實</span>':'<span class="virtual">候選暗拱，未填實</span>'}</div></div>`).join(''):'<div class="symbol-item"><div class="symbol-note">目前原局、大運及流年未見符合規則的暗拱組合。</div></div>'}
function nineMonthTaiYuan(){if(!natal)return "—";return G[(G.indexOf(natal.month.gan)+2)%10]+Z[(Z.indexOf(natal.month.zhi)+4)%12]}
function renderAdvanced(){const host=document.getElementById('advancedContent');if(!host||!ec)return;const element=STEM_ELEMENT[pivot]||'wood';const data=`${accordion('滴天髓徵義・十干性情',classicContent(DITIANSUI[pivot],'《滴天髓徵義》','內容隨目前立極天干切換。'),true)}${accordion('淵海子平・十干體象',classicContent(YUANHAI[pivot],'《淵海子平・干支體象》','以目前立極天干閱讀十干體象。'))}${accordion('造化元鑰・五行分論',`<div class="classic-quote">${ZAOHUA_WUXING[element]}</div><div class="source">──《造化元鑰・五行分論》</div><div class="comment">五行分論會隨目前立極天干轉換。</div>`)}${accordion('造化元鑰・十干總論',`<div class="classic-quote">${ZAOHUA_STEM[pivot]}</div><div class="source">──《造化元鑰・${pivot}木總論》</div><div class="comment">採繁體中文摘要，作為五行氣勢與調候的參考提示。</div>`)}${accordion('暗拱地支（候選）',renderDarkArch())}`;host.innerHTML=`<div class="folio-title">經典與進階資料</div><div class="accordion">${data}</div><div class="quiet-box"><div class="quiet-label">胎元・命宮・身宮</div><div class="info-line"><span>胎元</span><span>${call(ec,'getTaiYuan')}</span></div><div class="info-line"><span>胎元 (9 個月)</span><span>${nineMonthTaiYuan()}</span></div><div class="info-line"><span>命宮</span><span>${call(ec,'getMingGong')}</span></div><div class="info-line"><span>身宮</span><span>${call(ec,'getShenGong')}</span></div></div>`;host.querySelectorAll('.acc-head').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'))}
function eot(d){const n=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000),b=2*Math.PI*(n-81)/364;return 9.87*Math.sin(2*b)-7.53*Math.cos(b)-1.5*Math.sin(b)}
const JQ={DA_XUE:'大雪',DONG_ZHI:'冬至',XIAO_HAN:'小寒',DA_HAN:'大寒',LI_CHUN:'立春',YU_SHUI:'雨水',JING_ZHE:'驚蟄',CHUN_FEN:'春分',QING_MING:'清明',GU_YU:'穀雨',LI_XIA:'立夏',XIAO_MAN:'小滿',MANG_ZHONG:'芒種',XIA_ZHI:'夏至',XIAO_SHU:'小暑',DA_SHU:'大暑',LI_QIU:'立秋',CHU_SHU:'處暑',BAI_LU:'白露',QIU_FEN:'秋分',HAN_LU:'寒露',SHUANG_JIANG:'霜降',LI_DONG:'立冬',XIAO_XUE:'小雪'};
const RULE=[['甲','後','雨水',15],['甲','前','大雪',7],['乙','後','春分',15],['乙','後','清明',10],['乙','前','大暑',3],['丙','後','立春',7],['丙','後','小滿',15],['丁','後','小暑',12],['丁','前','霜降',8],['戊','前','雨水',8],['戊','後','穀雨',15],['戊','後','霜降',15],['戊','前','處暑',8],['己','前','夏至',7],['己','後','大暑',15],['己','後','大寒',15],['庚','後','立夏',7],['庚','後','處暑',15],['辛','後','秋分',15],['辛','後','寒露',7],['辛','前','大寒',8],['壬','後','立秋',7],['壬','後','立冬',15],['壬','後','冬至',15],['癸','前','穀雨',5],['癸','後','小雪',8],['癸','後','大雪',15]];
function jieqi(date){const y=date.getFullYear(),birth=date.getTime(),seen=new Set(),a=[];[y-1,y,y+1].forEach(Y=>{const t=Solar.fromYmd(Y,6,15).getLunar().getJieQiTable();Object.keys(t).forEach(k=>{const s=t[k].getSolar?t[k].getSolar():t[k],n=JQ[k]||k,tm=new Date(s.getYear(),s.getMonth()-1,s.getDay()).getTime(),key=n+'@'+tm;if(!seen.has(key)){seen.add(key);a.push({n,s,t:tm})}})});a.sort((x,z)=>x.t-z.t);let p,n;a.forEach(x=>{if(x.t<=birth)p=x;else if(!n)n=x});const aft=(birth-p.t)/86400000,bef=(n.t-birth)/86400000,r=[];RULE.forEach(x=>{if(x[1]=='後'&&p.n==x[2]&&aft>=0&&aft<x[3])r.push(x[0]);if(x[1]=='前'&&n.n==x[2]&&bef>0&&bef<=x[3])r.push(x[0])});if(p.n==='驚蟄'&&aft<15)r.push('甲','乙');if(p.n==='芒種'&&aft<8)r.push('丙','戊');if(p.n==='白露'&&aft<15)r.push('庚','辛');const gs=[...new Set(r)],start=Math.max(0,a.indexOf(p)-2),items=a.slice(start,start+6).map(x=>`<div class="jq"><span>${x.n}${x===p?'<i class="badge">上一節氣</i>':x===n?'<i class="badge">下一節氣</i>':''}</span><span class="jq-date">${x.s.toYmd()}</span></div>`).join('');return `<div class="folio-title">時令</div><div class="season"><div class="info-line"><span>上一節氣</span><span>${p.n}</span></div><div class="info-line"><span>下一節氣</span><span>${n.n}</span></div><div class="info-line"><span>五行所值天干</span><span class="season-gans">${gs.length?gs.join('、'):'—'}</span></div><div class="hint">依據《人鑑》卷下「五行所值節氣一覽」。</div></div><div class="quiet-box">${items}</div>`}
function run(){try{const ds=document.getElementById('date').value,ts=document.getElementById('time').value;if(!ds||!ts)throw new Error('請輸入完整出生日期及時間');const [y,m,d]=ds.split('-').map(Number),[h,mi]=ts.split(':').map(Number),raw=new Date(y,m-1,d,h,mi),off=document.getElementById('solar').checked?((+document.getElementById('lng').value-120)*4+eot(raw)):0,fd=new Date(raw.getTime()+off*60000),sol=Solar.fromYmdHms(fd.getFullYear(),fd.getMonth()+1,fd.getDate(),fd.getHours(),fd.getMinutes(),0),lu=sol.getLunar();ec=lu.getEightChar();const Y=ec.getYear(),M=ec.getMonth(),D=ec.getDay(),T=ec.getTime();natal={time:col('時柱','',T[0],T[1]),day:col('日柱','',D[0],D[1]),month:col('月柱','',M[0],M[1]),year:col('年柱','',Y[0],Y[1])};pivot=D[0];dy=ln=null;document.getElementById('out').innerHTML=`<div class="tabs"><button class="active" data-t="basic">命盤</button><button data-t="advanced">經典</button></div><section class="panel active" id="basic"><div class="intro">閱讀方向：時柱、日柱、月柱、年柱。選擇大運及流年後，冊頁會自動收束欄距。十神色籤保持低調，干支為主角。</div><div class="folio-title">原局</div><div id="chart"></div><div id="yun"></div><div class="quiet-box"><div class="quiet-label">出生曆法</div><div class="info-line"><span>農曆</span><span>${lu.toString()}</span></div><div class="info-line"><span>生肖</span><span>${lu.getYearShengXiao()}</span></div><div class="info-line"><span>真太陽時</span><span>${fd.getFullYear()}-${String(fd.getMonth()+1).padStart(2,'0')}-${String(fd.getDate()).padStart(2,'0')} ${String(fd.getHours()).padStart(2,'0')}:${String(fd.getMinutes()).padStart(2,'0')}</span></div></div>${jieqi(fd)}</section><section class="panel" id="advanced"><div id="advancedContent"></div></section>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.t))});draw();renderYun();renderAdvanced()}catch(e){document.getElementById('out').innerHTML=`<div class="err">計算失敗：${e.message}</div>`}}
document.getElementById('calc').onclick=run;
const P=[['ry','年柱'],['rm','月柱'],['rd','日柱'],['rt','時柱']],DEF={ry:['甲','子'],rm:['丙','寅'],rd:['甲','子'],rt:['甲','子']};
function pairOpts(a,sel){return a.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}
document.getElementById('reverseForm').innerHTML=P.map(([k,l])=>`<div class="row"><label>${l}<span id="${k}Valid" class="hint" style="margin:0 0 0 6px;display:inline">合法</span></label><div class="control" style="gap:6px"><select id="${k}Gan" style="width:52px">${pairOpts(G,DEF[k][0])}</select><select id="${k}Zhi" style="width:52px">${pairOpts(Z,DEF[k][1])}</select></div></div>`).join('');
function pairValue(k){return {g:document.getElementById(k+'Gan').value,z:document.getElementById(k+'Zhi').value}}
function pairValid(k){const v=pairValue(k),ok=G.indexOf(v.g)%2===Z.indexOf(v.z)%2,badge=document.getElementById(k+'Valid');badge.textContent=ok?'合法':'不合法';badge.style.color=ok?'#496642':'#9a4338';return ok}
P.forEach(([k])=>{document.getElementById(k+'Gan').onchange=()=>pairValid(k);document.getElementById(k+'Zhi').onchange=()=>pairValid(k)});
function verifyEightChar(sol,target){try{const ec=sol.getLunar().getEightChar();return ec.getYear()===target.ry&&ec.getMonth()===target.rm&&ec.getDay()===target.rd&&ec.getTime()===target.rt}catch{return false}}
document.getElementById('search').onclick=()=>{
 let ok=true;const target={};
 P.forEach(([k])=>{const v=pairValue(k);target[k]=v.g+v.z;if(!pairValid(k))ok=false});
 if(!ok){document.getElementById('revout').innerHTML='<div class="err">請先修正不合法的天干地支配對。</div>';return}
 try{
  const b=+document.getElementById('base').value||2026,found=new Map();
  for(let ref=b-300;ref<=b+300;ref+=60){
   let candidates=[];
   try{candidates=Solar.fromBaZi(target.ry,target.rm,target.rd,target.rt,2,ref)||[]}catch(e){continue}
   candidates.forEach(s=>{if(s.getYear()>=b-300&&s.getYear()<=b+300&&verifyEightChar(s,target))found.set(s.toYmdHms(),s)});
  }
  const a=[...found.values()].sort((x,y)=>x.subtract(y));
  document.getElementById('revout').innerHTML=a.length?`<div class="folio-title">符合結果・${a.length}組</div><div class="quiet-box">${a.map(s=>`<div class="jq click" data-y="${s.getYear()}" data-m="${s.getMonth()}" data-d="${s.getDay()}" data-h="${s.getHour()}" data-mi="${s.getMinute()}"><span>${s.toYmdHms()}</span><span class="jq-date">${s.getLunar().toString()}</span></div>`).join('')}</div><div class="hint">點選任一結果，即可回填出生資料並直接排盤。</div>`:'<div class="err">在指定前後300年範圍內未找到完全符合的結果。</div>';
  document.querySelectorAll('#revout .jq.click').forEach(el=>el.onclick=()=>{
   const y=el.dataset.y,m=String(el.dataset.m).padStart(2,'0'),d=String(el.dataset.d).padStart(2,'0'),h=String(el.dataset.h).padStart(2,'0'),mi=String(el.dataset.mi).padStart(2,'0');
   document.getElementById('date').value=`${y}-${m}-${d}`;
   document.getElementById('time').value=`${h}:${mi}`;
   document.getElementById('solar').checked=false;
   page('forward');
   document.getElementById('calc').click();
   window.scrollTo({top:0,behavior:'smooth'});
  });
 }catch(e){document.getElementById('revout').innerHTML=`<div class="err">搜尋失敗：${e.message}</div>`}
};
})();
