px;width:21px;height:21px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:var(--moss)}.switch input:checked+.slider:before{transform:translateX(21px)}.tabs{display:flex;margin:18px 0 10px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:9px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:13px}.tabs button.active{border-color:var(--indigo);color:var(--indigo);font-weight:700}.panel{display:none}.panel.active{display:block}.note{margin-bottom:9px;padding:8px 10px;border-left:3px solid var(--indigo);background:#eef1f3;color:#586471;font-size:12px;line-height:1.5}
.chart-scroll{overflow:hidden}.chart-scale{width:100%;margin:auto}.heads{display:flex;margin-bottom:5px;color:var(--muted);font-size:12px;text-align:center}.origin-h{flex:4}.trans-h{flex:1;margin-left:4px}.heads small{display:block;font-size:9px;color:#9a958b;margin-top:2px}.board{display:flex;align-items:stretch}.origin{flex:4;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line)}.trans{flex:1;margin-left:4px;border:1px solid var(--line)}.pillar{min-width:0;min-height:228px;border-right:1px solid var(--line);display:flex;flex-direction:column}.pillar:last-child{border:0}.trans .pillar{width:100%;border:0}.p-top{height:105px;padding:8px 5px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 32px}.gan{font-family:serif;font-size:26px;font-weight:600;line-height:1.1;padding:1px 2px}.ten{font-size:11px;line-height:1.35;text-align:center;padding:3px 1px;min-height:24px;color:#fff}.bg-wood{background:var(--wood)}.bg-fire{background:var(--fire)}.bg-earth{background:var(--earth)}.bg-metal{background:var(--metal);color:#322600}.bg-water{background:var(--water)}.p-bottom{padding:8px 5px;display:grid;grid-template-columns:1fr 32px;gap:4px 2px;align-content:start}.zhi{font-family:serif;font-size:25px;font-weight:600;line-height:1.1;padding:1px 2px}.life{font-size:10px;color:var(--muted);padding-top:4px;text-align:center}.hiddens,.h-tens{display:flex;flex-direction:column;gap:3px}.hgan{font-family:serif;font-size:15px;line-height:1.1;padding:1px 2px;width:max-content}.h-tens span{font-size:10px;padding:2px 1px;color:#fff;text-align:center;min-height:18px}.h-tens .bg-metal{color:#322600}.click{cursor:pointer}.click:active{background:#e5e0d5}.wood{color:var(--wood)}.fire{color:var(--fire)}.earth{color:var(--earth)}.metal{color:var(--metal)}.water{color:var(--water)}.legend{margin:8px 1px;color:var(--muted);font-size:11px;line-height:1.55}
.columns-5 .heads{font-size:11px}.columns-5 .trans-h{margin-left:3px}.columns-5 .trans{margin-left:3px}.columns-5 .p-top{height:96px;padding:7px 3px;grid-template-columns:1fr 28px}.columns-5 .p-bottom{padding:7px 3px;grid-template-columns:1fr 28px;gap:3px 1px}.columns-5 .pillar{min-height:210px}.columns-5 .gan{font-size:23px}.columns-5 .zhi{font-size:22px}.columns-5 .ten{font-size:10px}.columns-5 .hgan{font-size:13px}.columns-5 .h-tens span{font-size:9px;min-height:17px}.columns-5 .life{font-size:9px}
.columns-6 .heads{font-size:10px}.columns-6 .heads small{font-size:8px}.columns-6 .trans-h{margin-left:2px}.columns-6 .trans{margin-left:2px}.columns-6 .p-top{height:88px;padding:6px 2px;grid-template-columns:1fr 24px}.columns-6 .p-bottom{padding:6px 2px;grid-template-columns:1fr 24px;gap:2px 1px}.columns-6 .pillar{min-height:194px}.columns-6 .gan{font-size:20px}.columns-6 .zhi{font-size:20px}.columns-6 .ten{font-size:8px;line-height:1.25;min-height:21px}.columns-6 .hgan{font-size:12px}.columns-6 .h-tens{gap:2px}.columns-6 .h-tens span{font-size:8px;min-height:15px;padding:1px 0}.columns-6 .life{font-size:8px}.columns-6 .legend{font-size:10px}
.dybar{display:flex;gap:7px;overflow-x:auto;padding:5px 0}.dy{flex:0 0 58px;background:#f5f2ea;color:var(--ink);border:1px solid var(--line);padding:6px 2px;text-align:center}.dy.selected,.ln.selected{border:2px solid var(--indigo);background:#edf0f1}.age,.year{font-size:9px;color:#928c80}.gz{display:flex;flex-direction:column;font-family:serif;font-size:20px;font-weight:600;line-height:1.05;margin:3px 0}.lngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ln{min-height:78px;background:#f5f2ea;color:var(--ink);border:1px solid var(--line);padding:5px 2px;text-align:center}.ln.now{background:#fbf2e7}.season{border-color:#d6c49f;background:#fffaf0}.season-gans{font-family:serif;color:#936b2f;font-size:25px;font-weight:600;letter-spacing:5px}.jq{padding:11px 13px;border-bottom:1px solid #e7e2d8;display:flex;justify-content:space-between}.jq:last-child{border:0}.jq-date{font-size:12px;color:var(--muted)}.badge{margin-left:5px;padding:2px 5px;background:#efe3c7;color:#806330;font-size:10px}.symbol-item{padding:10px 0;border-bottom:1px solid #e7e2d8}.symbol-item:last-child{border:0}.symbol-main{font-family:serif;font-size:18px;font-weight:600}.symbol-note{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.45}.filled{display:inline-block;margin-left:5px;padding:1px 5px;background:#eee9dc;color:#756d5e;font-size:10px}.virtual{display:inline-block;margin-left:5px;padding:1px 5px;background:#eef1f3;color:#52657c;font-size:10px}.classic{border-left:3px solid var(--ochre);background:#fffaf0}.classic-title{font-family:serif;font-size:18px;font-weight:600;color:#5c4a2f}.classic-quote{margin-top:8px;font-family:serif;font-size:15px;line-height:1.8;letter-spacing:.3px}.classic-note{margin-top:7px;color:var(--muted);font-size:11px;line-height:1.5}.zaohua{border-left:3px solid var(--moss);background:#f8fbf4}.zaohua-title{font-family:serif;font-size:18px;font-weight:600;color:#43553d}.zaohua-body{margin-top:8px;font-size:14px;line-height:1.75}.zaohua-note{margin-top:8px;padding:7px 8px;background:#edf3e8;color:#506047;font-size:11px;line-height:1.5}.tabbar{margin-top:auto;position:sticky;bottom:0;padding-bottom:var(--bottom);display:flex;background:#fbfaf5;border-top:1px solid var(--line)}.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;font-size:12px}.tabbar button.active{color:var(--indigo)}.err{padding:12px;color:var(--vermilion);text-align:center}

<body>
<div id="app">
<header class="nav"><h1>子平八字</h1><p>四柱・大運・流年</p></header>
<div class="seg"><button class="active" data-page="forward">出生 → 八字</button><button data-page="reverse">八字 → 出生</button></div>
<main class="page active" id="forward">
<div class="title">出生資料</div>
<div class="list"><div class="row"><label>性別</label><div class="control"><select id="gender"><option value="1">男</option><option value="0">女</option></select></div></div><div class="row"><label>公曆日期</label><div class="control"><input id="date" type="date" value="1990-01-01"></div></div><div class="row"><label>出生時間</label><div class="control"><input id="time" type="time" value="12:00"></div></div></div>
<div class="title">真太陽時</div>
<div class="list"><div class="row"><label>啟用校正</label><div class="control"><label class="switch"><input id="solar" type="checkbox" checked><span class="slider"></span></label></div></div><div class="row"><label>出生地經度（東經＋）</label><div class="control"><input id="lng" type="number" value="114.17" step="0.01" style="width:100px"></div></div><div class="row"><label>常用地點</label><div class="control"><select id="city"><option value="">— 快速套用 —</option><option value="114.17">香港</option><option value="113.26">廣州</option><option value="116.40">北京</option><option value="121.47">上海</option><option value="121.56">台北</option></select></div></div></div>
<div class="hint">點天干或任何藏干，可靜默切換十神及十二長生的立極天干。</div><button id="calc" class="btn">排出命盤</button><div id="out"></div>
</main>
<main class="page" id="reverse"><div class="title">輸入四柱干支</div><div class="list"><div class="row"><label>年柱</label><div class="control"><select id="ry"></select></div></div><div class="row"><label>月柱</label><div class="control"><select id="rm"></select></div></div><div class="row"><label>日柱</label><div class="control"><select id="rd"></select></div></div><div class="row"><label>時柱</label><div class="control"><select id="rt"></select></div></div><div class="row"><label>查詢基準年</label><div class="control"><input id="base" type="number" value="2026" style="width:90px"></div></div></div><button id="search" class="btn">搜尋對應日期</button><div id="revout"></div></main>
<nav class="tabbar"><button class="active" data-page="forward">排八字</button><button data-page="reverse">反查生辰</button></nav>
</div>
<script>
(()=>{
if(typeof Solar==='undefined'||typeof Lunar==='undefined'){document.getElementById('app').innerHTML='<div class="err">lunar-javascript 未能載入，請檢查網絡連線。</div>';return}
const G=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const Z=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GZ=Array.from({length:60},(_,i)=>G[i%10]+Z[i%12]);
const STEM_ELEMENT={'甲':'wood','乙':'wood','丙':'fire','丁':'fire','戊':'earth','己':'earth','庚':'metal','辛':'metal','壬':'water','癸':'water'};
const BRANCH_ELEMENT={'寅':'wood','卯':'wood','巳':'fire','午':'fire','辰':'earth','戌':'earth','丑':'earth','未':'earth','申':'metal','酉':'metal','亥':'water','子':'water'};
const YANG={'甲':1,'丙':1,'戊':1,'庚':1,'壬':1};
const EI={wood:0,fire:1,earth:2,metal:3,water:4};
const HIDE={'子':['癸'],'丑':['己','癸','辛'],'寅':['甲','丙','戊'],'卯':['乙'],'辰':['戊','乙','癸'],'巳':['丙','戊','庚'],'午':['丁','己'],'未':['己','丁','乙'],'申':['庚','壬','戊'],'酉':['辛'],'戌':['戊','辛','丁'],'亥':['壬','甲']};
const STEM_COMBOS=[{gans:['甲','己'],element:'土',out:'戊土'},{gans:['乙','庚'],element:'金',out:'庚金'},{gans:['丙','辛'],element:'水',out:'壬水'},{gans:['丁','壬'],element:'木',out:'甲木'},{gans:['戊','癸'],element:'火',out:'丙火'}];
const DARK_ARCH=[{pair:['子','寅'],result:'丑',type:'夾拱／金庫',adjacent:true},{pair:['卯','巳'],result:'辰',type:'夾拱／水庫',adjacent:true},{pair:['午','申'],result:'未',type:'夾拱／木庫',adjacent:true},{pair:['酉','亥'],result:'戌',type:'夾拱／火庫',adjacent:true},{pair:['申','辰'],result:'子',type:'三合拱水',adjacent:false},{pair:['寅','戌'],result:'午',type:'三合拱火',adjacent:false},{pair:['亥','未'],result:'卯',type:'三合拱木',adjacent:false},{pair:['巳','丑'],result:'酉',type:'三合拱金',adjacent:false}];
const CHANG_STAGES=['長生','沐浴','冠帶','臨官','帝旺','衰','病','死','墓','絕','胎','養'];
const YANG_START={甲:'亥',乙:'亥',丙:'寅',丁:'寅',戊:'寅',己:'寅',庚:'巳',辛:'巳',壬:'申',癸:'申'};
const DITIANSUI={甲:'甲木參天，脫胎要火。春不容金，秋不容土；火熾乘龍，水蕩騎虎，地潤天和，植立千古。',乙:'乙木雖柔，刲羊解牛。懷丁抱丙，跨鳳乘猴；虛濕之地，騎馬亦憂；藤蘿繫甲，可春可秋。',丙:'丙火猛烈，欺霜侮雪。能煅庚金，逢辛反怯；土眾成慈，水猖顯節；虎馬犬鄉，甲來成滅。',丁:'丁火柔中，內性昭融。抱乙而孝，合壬而忠；旺而不烈，衰而不窮；如有嫡母，可秋可冬。',戊:'戊土固重，既中且正。靜翕動闢，萬物司命；水潤物生，火燥物病；若在艮坤，怕沖宜靜。',己:'己土卑濕，中正蓄藏。不愁木盛，不畏水狂；火少火晦，金多金光；若要物旺，宜助宜幫。',庚:'庚金帶煞，剛健為最。得水而清，得火而銳；土潤則生，土乾則脆；能贏甲兄，輸於乙妹。',辛:'辛金軟弱，溫潤而清。畏土之疊，樂水之盈；能扶社稷，能救生靈；熱則喜母，寒則喜丁。',壬:'壬水通河，能洩金氣。剛中之德，周流不滯；通根透癸，沖天奔地；化則有情，從則相濟。',癸:'癸水至弱，達於天津。得龍而運，功化斯神；不愁火土，不論庚辛；合戊見火，化象斯真。'};
const YUANHAI={甲:'甲木天干作首排，原無枝葉與根荄；欲存天地千年久，直向沙泥萬丈埋。斫就棟樑金得用，化成灰炭火為災；蠢然塊物無機事，一任春秋自往來。',乙:'乙木根荄種得深，只宜陽地不宜陰；漂浮最怕多逢水，刻斫何須苦用金。南去火炎災不淺，西行土重禍猶侵；棟樑不是連根木，辨別工夫好用心。',丙:'丙火明明一太陽，原從正大立綱常；洪光不獨窺千里，巨焰猶能遍八荒。出世肯為浮木子，傳生不作濕泥娘；江湖死水安能克，惟怕成林木作殃。',丁:'丁火其形一燭燈，太陽相見奪光明；得時能鑄千斤鐵，失令難熔一寸金。雖少乾柴猶可引，縱多濕木不能生；乙木相生殊可喜，壬來相合最為清。',戊:'戊土城牆堤岸同，鎮江河海要根重；柱中帶合還須正，日下乘虛忌落空。水盛卻宜高堤防，火炎猶喜水相逢；若還獨坐財官旺，福祿榮華莫與同。',己:'己土田園屬四維，坤深萬物為之基；水金火木皆為喜，若在艮坤怕有虧。無根之土終難立，帶水之泥始有機；火少火多還有用，金多金少最相宜。',庚:'庚金頑鈍性偏剛，火制功成怕水鄉；夏日不宜逢水盛，冬天最愛見丙丁。能輸甲木成才器，能合乙木見義情；柱中若得根深厚，名利雙全祿位昌。',辛:'辛金珠玉性通靈，最愛陽和沙水清；成就不勞炎火煅，資扶偏喜濕泥生。木多火旺宜西北，水冷金寒要丙丁；坐祿通根身旺地，何愁富貴不光榮。',壬:'壬水汪洋並百川，漫流天下總無邊；干支多聚成漂蕩，火土重逢涸本源。養性結胎須未午，長生化祿屬申乾；能生大木還宜甲，化殺生權在火天。',癸:'癸水應非雨露謂，根通亥子即江河；柱無坤坎身還弱，局有財官不尚多。申子辰全成上格，寅卯東方遇不和；假饒火土生深夏，西北行程豈太過。'};
const ZAOHUA_WUXING={wood:'木性騰上而無所止，氣重則欲金任使；木有金，則有惟高惟斂之德。木賴水生，水盛而木則漂流；木欲火發，火多而木則焚燼。',fire:'火性炎上，遇木則明，遇水則滅；得土而晦，得金而熄。火旺宜水濟，火弱喜木生，調候須辨寒暖燥濕。',earth:'土居四維，為五行之樞紐。土賴火暖，得水潤而生；土重宜木疏，土虛喜火土扶持。寒濕先火，燥烈先水。',metal:'金性剛健，賴土生扶，得水淘洗，逢火煅鍊。金剛宜火制，金寒喜火暖；土重恐埋，水多則沉。',water:'水性潤下，通河達海。水旺喜土堤防，水寒喜火溫暖，水涸喜金生源；得木則洩秀，過盛則泛濫。'};
const ZAOHUA_STEM={甲:'甲木為陽木，如喬木棟樑，體剛性直。宜根深土厚，得火發榮；木旺宜金斫削，寒木首重丙火溫養。',乙:'乙木為陰木，如花草藤蘿，性柔而有依。宜陽和水潤，得甲可攀；水多則漂，金重則傷，火炎土燥亦須調劑。',丙:'丙火為陽火，如太陽之光，性剛烈而普照。宜壬水輔映，甲木生扶；火盛須水濟，火弱喜木助。',丁:'丁火為陰火，如燈燭爐火，柔中而有昭融。喜甲乙引助，壬水相合；寒局喜木火，火盛仍須水土調和。',戊:'戊土為陽土，如城牆堤岸，重厚而能制水。宜丙火暖，甲木疏；土燥喜水，土濕喜火，土重不可壅塞。',己:'己土為陰土，如田園沃壤，卑濕而能蓄藏。喜丙火暖土，甲木疏通；水盛土虛，火多土焦，皆須中和。',庚:'庚金為陽金，如頑鐵利器，剛健而宜鍛鍊。喜丙丁火煅，壬癸水清，戊己土生；金寒尤重火暖。',辛:'辛金為陰金，如珠玉金銀，溫潤而清。喜壬水淘洗，戊土生扶，丙火暖局；土重易埋，火烈易熔。',壬:'壬水為陽水，如江河大川，周流而不滯。喜戊土堤防，丙火暖局，庚金發源；水旺亦喜木洩其秀。',癸:'癸水為陰水，如雨露泉源，柔弱而能潤物。喜丙火暖，庚辛金生，戊土制；水寒土濕，首重火土相濟。'};
let natal=null,pivot=null,dy=null,ln=null,ec=null;
const call=(o,n,...a)=>{try{return typeof o[n]==='function'?o[n](...a):''}catch{return''}};
function stemClass(g){return STEM_ELEMENT[g]||'earth'}
function branchClass(z){return BRANCH_ELEMENT[z]||'earth'}
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}
document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>page(x.dataset.page));
document.getElementById('city').onchange=e=>{if(e.target.value)document.getElementById('lng').value=e.target.value};
function ss(day,target){const r=(EI[STEM_ELEMENT[target]]-EI[STEM_ELEMENT[day]]+5)%5,s=!!YANG[day]===!!YANG[target];return r===0?(s?'比肩':'劫財'):r===1?(s?'食神':'傷官'):r===2?(s?'偏財':'正財'):r===3?(s?'七殺':'正官'):(s?'偏印':'正印')}
function bgByGan(gan){return 'bg-'+(STEM_ELEMENT[gan]||'earth')}
function hg(z){return HIDE[z]||[]}
function lifeStage(gan,zhi){const start=Z.indexOf(YANG_START[gan]);const at=Z.indexOf(zhi);return CHANG_STAGES[(at-start+12)%12]}
function col(label,sub,gan,zhi){return{label,sub,gan,zhi}}
function pillar(c){const h=hg(c.zhi),t=ss(pivot,c.gan);return `<div class="pillar"><div class="p-top"><span class="gan ${stemClass(c.gan)} click" data-g="${c.gan}">${c.gan}</span><span class="ten ${bgByGan(c.gan)}">${t}</span></div><div class="p-bottom"><span class="zhi ${branchClass(c.zhi)}">${c.zhi}</span><span class="life">${lifeStage(pivot,c.zhi)}</span><div class="hiddens">${h.map(g=>`<span class="hgan ${stemClass(g)} click" data-g="${g}">${g}</span>`).join('')}</div><div class="h-tens">${h.map(g=>`<span class="${bgByGan(g)}">${ss(pivot,g)}</span>`).join('')}</div></div></div>`}
function allColumns(){const a=[natal.time,natal.day,natal.month,natal.year];if(dy)a.push(dy);if(ln)a.push(ln);return a}
function renderTopCombos(){if(!natal)return'';const cols=allColumns(),hits=[];for(const r of STEM_COMBOS){const a=cols.filter(c=>c.gan===r.gans[0]),b=cols.filter(c=>c.gan===r.gans[1]);if(a.length&&b.length)hits.push({r,s:[...a,...b]})}if(!hits.length)return'';return `<div class="title">天干五合（候選）</div><div class="card">${hits.map(x=>`<div class="symbol-item"><div class="symbol-main">${x.r.gans.join('＋')}　→　${x.r.out}</div><div class="symbol-note">來源：${x.s.map(c=>c.label+'天干（'+c.gan+'）').join('、')}。<span class="virtual">陽干化象候選</span></div></div>`).join('')}</div>`}
function draw(){if(!natal)return;const n=[natal.time,natal.day,natal.month,natal.year],t=[];if(dy)t.push(dy);if(ln)t.push(ln);const count=4+t.length;document.getElementById('chart').innerHTML=`${renderTopCombos()}<div class="chart-scroll"><div class="chart-scale columns-${count}"><div class="heads"><div class="origin-h">原局</div>${t.map(x=>`<div class="trans-h">${x.label}<small>${x.sub}</small></div>`).join('')}</div><div class="board"><div class="origin">${n.map(pillar).join('')}</div>${t.map(x=>`<div class="trans">${pillar(x)}</div>`).join('')}</div></div></div><div class="legend">${count===4?'原局四柱使用標準字級。':count===5?'已選大運：五柱自動縮放。':'已選大運及流年：六柱自動縮放，以適合 iPhone 可視寬度。'} 十二長生以目前立極天干採陽式順排。</div>`;document.querySelectorAll('#chart .click').forEach(e=>e.onclick=()=>{pivot=e.dataset.g;draw();renderYun();renderAdvanced()})}
function mkDY(d,i){const q=call(d,'getGanZhi');const x=col('大運',`${call(d,'getStartYear')}–${call(d,'getEndYear')}`,q[0],q[1]);x.index=i;return x}
function mkLN(l){const q=call(l,'getGanZhi');return col('流年',String(call(l,'getYear')),q[0],q[1])}
function renderYun(){if(!ec)return;const e=document.getElementById('yun');if(!e)return;const yun=ec.getYun(+document.getElementById('gender').value);const all=yun.getDaYun(10);const ls=all.filter((d,i)=>i>0&&call(d,'getGanZhi'));
const chips=ls.map((d,i)=>{const x=mkDY(d,i),a=call(d,'getStartAge'),b=call(d,'getEndAge');return `<button class="dy ${dy&&dy.index===i?'selected':''}" data-i="${i}"><div class="age">${a}–${b}歲</div><div class="gz"><span class="${stemClass(x.gan)}">${x.gan}</span><span class="${branchClass(x.zhi)}">${x.zhi}</span></div><div class="year">${x.sub}</div></button>`}).join('');
let panel='';if(dy){const d=ls[dy.index],a=d.getLiuNian().map(l=>{const x=mkLN(l),now=x.sub==new Date().getFullYear();return `<button class="ln ${ln&&ln.sub===x.sub?'selected':''} ${now?'now':''}" data-y="${x.sub}" data-g="${x.gan}" data-z="${x.zhi}"><div class="year">${x.sub}</div><div class="gz"><span class="${stemClass(x.gan)}">${x.gan}</span><span class="${branchClass(x.zhi)}">${x.zhi}</span></div><div class="age">${call(l,'getAge')}歲</div></button>`}).join('');panel=`<div class="title">流年 · ${dy.gan}${dy.zhi}大運</div><div class="lngrid">${a}</div>`}
e.innerHTML=`<div class="title">大運及流年</div><div class="card"><div class="hint">第一步大運按月柱、性別及陰陽順逆推算；不顯示起運前的 Undefined 佔位項目。</div><div class="dybar">${chips}</div>${panel}</div>`;
e.querySelectorAll('.dy').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(dy&&dy.index===i){dy=null;ln=null}else{dy=mkDY(ls[i],i);ln=null}draw();renderYun();renderAdvanced()});
e.querySelectorAll('.ln').forEach(b=>b.onclick=()=>{if(ln&&ln.sub===b.dataset.y)ln=null;else ln=col('流年',b.dataset.y,b.dataset.g,b.dataset.z);draw();renderYun();renderAdvanced()})}
function renderDarkArch(){if(!natal)return'';const cols=allColumns(),branches=cols.map((c,i)=>({i,label:c.label,zhi:c.zhi})),hits=[];for(const r of DARK_ARCH){const a=branches.filter(x=>x.zhi===r.pair[0]),b=branches.filter(x=>x.zhi===r.pair[1]);let p=[];for(const x of a)for(const y of b){if(!r.adjacent||Math.abs(x.i-y.i)===1)p.push([x,y])}if(p.length)hits.push({r,p,filled:branches.some(x=>x.zhi===r.result)})}return `<div class="title">暗拱地支（候選）</div><div class="card">${hits.length?hits.map(x=>`<div class="symbol-item"><div class="symbol-main">${x.r.pair.join('、')}　→　${x.r.result}</div><div class="symbol-note">來源：${x.p.map(p=>p[0].label+'支、'+p[1].label+'支').join('；')}。類型：${x.r.type}。${x.filled?'<span class="filled">被拱地支已填實</span>':'<span class="virtual">候選暗拱，未填實</span>'}</div></div>`).join(''):'<div class="symbol-item"><div class="symbol-note">目前原局、大運及流年未見符合規則的暗拱組合。</div></div>'}</div>`}
function classicCard(title,quote,note){return `<div class="title">${title}</div><div class="card classic"><div class="classic-title">${pivot}日主</div><div class="classic-quote">${quote}</div><div class="classic-note">${note}</div></div>`}
function zaohuaCards(){const element=STEM_ELEMENT[pivot]||'wood';const wuxing=ZAOHUA_WUXING[element]||ZAOHUA_WUXING.wood;const stem=ZAOHUA_STEM[pivot]||'資料暫未提供。';return `<div class="title">造化元鑰・五行分論</div><div class="card zaohua"><div class="zaohua-title">${pivot}日主・${({wood:'木',fire:'火',earth:'土',metal:'金',water:'水'})[element]||'木'}行</div><div class="zaohua-body">${wuxing}</div><div class="zaohua-note">五行分論會隨目前立極天干轉換。</div></div><div class="title">造化元鑰・十干總論</div><div class="card zaohua"><div class="zaohua-title">${pivot}日主總論</div><div class="zaohua-body">${stem}</div><div class="zaohua-note">採繁體中文摘要，作為五行氣勢與調候的參考提示。</div></div>`}
function renderAdvanced(){const host=document.getElementById('advancedContent');if(!host||!ec)return;try{host.innerHTML=`${classicCard('滴天髓徵義・十干性情',DITIANSUI[pivot]||'—','此段會隨目前立極天干切換。十二長生亦以此天干採陽式順排。')}${classicCard('淵海子平・十干體象',YUANHAI[pivot]||'—','《淵海子平》卷四〈干支體象〉天干詩訣；內容隨目前立極天干切換。')}${zaohuaCards()}${renderDarkArch()}<div class="title">胎元及附加資料</div><div class="card"><div class="row"><span>胎元干支</span><span>${call(ec,'getTaiYuan')}</span></div><div class="row"><span>胎元納音</span><span>${call(ec,'getTaiYuanNaYin')}</span></div><div class="row"><span>命宮</span><span>${call(ec,'getMingGong')}</span></div><div class="row"><span>身宮</span><span>${call(ec,'getShenGong')}</span></div></div>`}catch(e){host.innerHTML='<div class="err">進階資料顯示失敗，但命盤計算不受影響。</div>'}}
function eot(d){const n=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000),b=2*Math.PI*(n-81)/364;return 9.87*Math.sin(2*b)-7.53*Math.cos(b)-1.5*Math.sin(b)}
function run(){try{const ds=document.getElementById('date').value,ts=document.getElementById('time').value;if(!ds||!ts)throw new Error('請輸入完整出生日期及時間');const [y,m,d]=ds.split('-').map(Number),[h,mi]=ts.split(':').map(Number),raw=new Date(y,m-1,d,h,mi),off=document.getElementById('solar').checked?((+document.getElementById('lng').value-120)*4+eot(raw)):0,fd=new Date(raw.getTime()+off*60000),sol=Solar.fromYmdHms(fd.getFullYear(),fd.getMonth()+1,fd.getDate(),fd.getHours(),fd.getMinutes(),0),lu=sol.getLunar();ec=lu.getEightChar();const Y=ec.getYear(),M=ec.getMonth(),D=ec.getDay(),T=ec.getTime();natal={time:col('時柱','',T[0],T[1]),day:col('日柱','',D[0],D[1]),month:col('月柱','',M[0],M[1]),year:col('年柱','',Y[0],Y[1])};pivot=D[0];dy=ln=null;document.getElementById('out').innerHTML=`<div class="tabs"><button class="active" data-t="basic">基本命盤</button><button data-t="advanced">進階資料</button></div><section class="panel active" id="basic"><div class="note">十二長生依目前立極天干，十干一律採陽式順排；五合顯示於命盤上方，暗拱顯示於進階資料下方。</div><div class="title">原局</div><div class="card"><div id="chart"></div></div><div id="yun"></div><div class="title">曆法資訊</div><div class="card"><div class="row"><span>農曆</span><span>${lu.toString()}</span></div><div class="row"><span>生肖</span><span>${lu.getYearShengXiao()}</span></div></div></section><section class="panel" id="advanced"><div id="advancedContent"></div></section>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.t))});draw();renderYun();renderAdvanced()}catch(e){document.getElementById('out').innerHTML=`<div class="err">計算失敗：${e.message}</div>`}}
document.getElementById('calc').onclick=run;
['ry','rm','rd','rt'].forEach(id=>document.getElementById(id).innerHTML=GZ.map(x=>`<option>${x}</option>`).join(''));
document.getElementById('search').onclick=()=>{try{const b=+document.getElementById('base').value||2026,a=Solar.fromBaZi(document.getElementById('ry').value,document.getElementById('rm').value,document.getElementById('rd').value,document.getElementById('rt').value,2,b).filter(x=>x.getYear()>=b-300&&x.getYear()<=b+300);document.getElementById('revout').innerHTML=a.length?`<div class="title">符合結果（${a.length}組）</div><div class="list">${a.map(s=>`<div class="jq"><span>${s.toYmdHms()}</span><span class="jq-date">${s.getLunar().toString()}</span></div>`).join('')}</div>`:'<div class="err">未找到符合結果。</div>'}catch(e){document.getElementById('revout').innerHTML=`<div class="err">搜尋失敗：${e.message}</div>`}}
})();
</script>
</body>
</html>
