<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>子平八字</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.js"></script>
<style>
:root{--paper:#f7f5ef;--card:#fffdf8;--ink:#292722;--muted:#7a766d;--line:#d9d3c7;--indigo:#344b6b;--moss:#6d7a5e;--vermilion:#b85b4b;--ochre:#a77c3c;--blue:#607d9f;--safe:env(safe-area-inset-top,20px);--bottom:env(safe-area-inset-bottom,10px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","PingFang HK",sans-serif}button,input,select{font:inherit}button{cursor:pointer}#app{width:480px;min-height:100vh;margin:auto;background:var(--paper);display:flex;flex-direction:column}.nav{padding-top:var(--safe);background:#fbfaf5;border-bottom:1px solid var(--line)}.nav h1{height:44px;margin:0;display:grid;place-items:center;font-family:serif;font-size:20px;font-weight:500;letter-spacing:3px}.nav p{margin:-4px 0 9px;text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px}.seg{height:36px;margin:10px 16px 8px;display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}.seg button{flex:1;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}.seg button:last-child{border:0}.seg button.active{background:var(--indigo);color:#fff}.page{display:none;padding:7px 18px 30px}.page.active{display:block}.title{margin:22px 1px 7px;color:var(--muted);font-size:12px;letter-spacing:1px}.list,.card{background:var(--card);border:1px solid var(--line);border-radius:3px}.card{padding:13px;margin-bottom:12px}.row{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:9px 13px;border-bottom:1px solid #e7e2d8;gap:10px}.row:last-child{border:0}.control{display:flex;justify-content:flex-end;flex:1}input,select{max-width:100%;border:0;outline:0;background:transparent;color:var(--indigo);text-align:right;font-size:15px}.hint{margin:8px 1px;color:var(--muted);font-size:12px;line-height:1.6}.btn{width:100%;margin-top:15px;padding:13px;border:0;border-radius:2px;background:var(--indigo);color:white;font-weight:700;letter-spacing:1px}.switch{position:relative;width:46px;height:25px}.switch input{opacity:0}.slider{position:absolute;inset:0;background:#c8c4bc;border-radius:20px}.slider:before{content:"";position:absolute;left:2px;top:2px;width:21px;height:21px;border-radius:50%;background:white;transition:.2s}.switch input:checked+.slider{background:var(--moss)}.switch input:checked+.slider:before{transform:translateX(21px)}.tabs{display:flex;margin:18px 0 10px;border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:9px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:13px}.tabs button.active{border-color:var(--indigo);color:var(--indigo);font-weight:700}.panel{display:none}.panel.active{display:block}.note{margin-bottom:9px;padding:8px 10px;border-left:3px solid var(--indigo);background:#eef1f3;color:#586471;font-size:12px;line-height:1.5}
.chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.heads{min-width:450px;display:flex;margin-bottom:5px;color:var(--muted);font-size:12px;text-align:center}.origin-h{width:344px}.trans-h{width:86px;margin-left:6px}.heads small{display:block;font-size:9px;color:#9a958b;margin-top:2px}.board{min-width:450px;display:flex;align-items:stretch}.origin{width:344px;display:grid;grid-template-columns:repeat(4,86px);border:1px solid var(--line)}.trans{width:86px;margin-left:6px;border:1px solid var(--line)}.pillar{width:86px;min-height:228px;border-right:1px solid var(--line);display:flex;flex-direction:column}.pillar:last-child{border:0}.trans .pillar{width:100%;border:0}.p-top{height:105px;padding:8px 5px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr 32px}.gan{font-family:serif;font-size:26px;font-weight:600;line-height:1.1;padding:1px 2px}.ten{font-size:11px;line-height:1.35;text-align:center;padding:3px 1px;min-height:24px;color:#fff}.wealth{background:#a3693e}.output{background:#687e9b}.resource{background:#526a8d}.peer{background:#768866}.officer{background:#7f92a5}.p-bottom{padding:8px 5px;display:grid;grid-template-columns:1fr 32px;gap:4px 2px;align-content:start}.zhi{font-family:serif;font-size:25px;font-weight:600;line-height:1.1;padding:1px 2px}.life{font-size:10px;color:var(--muted);padding-top:4px;text-align:center}.hiddens,.h-tens{display:flex;flex-direction:column;gap:3px}.hgan{font-family:serif;font-size:15px;line-height:1.1;padding:1px 2px;width:max-content}.h-tens span{font-size:10px;padding:2px 1px;color:white;text-align:center;min-height:18px}.click{cursor:pointer}.click:active{background:#e5e0d5}.wood{color:#557a50}.fire{color:var(--vermilion)}.earth{color:var(--ochre)}.metal{color:#5d6266}.water{color:#456e94}.legend{margin:8px 1px;color:var(--muted);font-size:11px;line-height:1.55}.dybar{display:flex;gap:7px;overflow-x:auto;padding:5px 0}.dy{flex:0 0 58px;background:#f5f2ea;color:var(--ink);border:1px solid var(--line);padding:6px 2px;text-align:center}.dy.selected,.ln.selected{border:2px solid var(--indigo);background:#edf0f1}.age,.year{font-size:9px;color:#928c80}.gz{display:flex;flex-direction:column;font-family:serif;font-size:20px;font-weight:600;line-height:1.05;margin:3px 0}.lngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.ln{min-height:78px;background:#f5f2ea;color:var(--ink);border:1px solid var(--line);padding:5px 2px;text-align:center}.ln.now{background:#fbf2e7}.season{border-color:#d6c49f;background:#fffaf0}.season-gans{font-family:serif;color:#936b2f;font-size:25px;font-weight:600;letter-spacing:5px}.jq{padding:11px 13px;border-bottom:1px solid #e7e2d8;display:flex;justify-content:space-between}.jq:last-child{border:0}.jq-date{font-size:12px;color:var(--muted)}.badge{margin-left:5px;padding:2px 5px;background:#efe3c7;color:#806330;font-size:10px}.tabbar{margin-top:auto;position:sticky;bottom:0;padding-bottom:var(--bottom);display:flex;background:#fbfaf5;border-top:1px solid var(--line)}.tabbar button{flex:1;border:0;background:transparent;color:var(--muted);padding:8px;font-size:12px}.tabbar button.active{color:var(--indigo)}.err{padding:12px;color:var(--vermilion);text-align:center}
</style>
</head>
<body>
<div id="app">
<header class="nav"><h1>子平八字</h1><p>四柱・大運・流年</p></header>
<div class="seg"><button class="active" data-page="forward">出生 → 八字</button><button data-page="reverse">八字 → 出生</button></div>
<main class="page active" id="forward">
<div class="title">出生資料</div>
<div class="list"><div class="row"><label>性別</label><div class="control"><select id="gender"><option value="1">男</option><option value="0">女</option></select></div></div><div class="row"><label>公曆日期</label><div class="control"><input id="date" type="date" value="1990-01-01"></div></div><div class="row"><label>出生時間</label><div class="control"><input id="time" type="time" value="12:00"></div></div></div>
<div class="title">真太陽時</div>
<div class="list"><div class="row"><label>啟用校正</label><div class="control"><label class="switch"><input id="solar" type="checkbox" checked><span class="slider"></span></label></div></div><div class="row"><label>出生地經度（東經＋）</label><div class="control"><input id="lng" type="number" value="114.17" step="0.01" style="width:100px"></div></div><div class="row"><label>常用地點</label><div class="control"><select id="city"><option value="">— 快速套用 —</option><option value="114.17">香港</option><option value="113.26">廣州</option><option value="116.40">北京</option><option value="121.47">上海</option><option value="121.56">台北</option></select></div></div></div>
<div class="hint">點天干或任何藏干，可靜默切換十神計算的立極點。</div><button id="calc" class="btn">排出命盤</button><div id="out"></div>
</main>
<main class="page" id="reverse"><div class="title">輸入四柱干支</div><div class="list"><div class="row"><label>年柱</label><div class="control"><select id="ry"></select></div></div><div class="row"><label>月柱</label><div class="control"><select id="rm"></select></div></div><div class="row"><label>日柱</label><div class="control"><select id="rd"></select></div></div><div class="row"><label>時柱</label><div class="control"><select id="rt"></select></div></div><div class="row"><label>查詢基準年</label><div class="control"><input id="base" type="number" value="2026" style="width:90px"></div></div></div><button id="search" class="btn">搜尋對應日期</button><div id="revout"></div></main>
<nav class="tabbar"><button class="active" data-page="forward">排八字</button><button data-page="reverse">反查生辰</button></nav>
</div>
<script>
(()=>{
if(typeof Solar==='undefined'||typeof Lunar==='undefined'){document.getElementById('app').innerHTML='<div class="err">lunar-javascript 未能載入，請檢查網絡連線。</div>';return}
const G=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const Z=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GZ=Array.from({length:60},(_,i)=>G[i%10]+Z[i%12]);
const EL={'甲':'wood','乙':'wood','丙':'fire','丁':'fire','戊':'earth','己':'earth','庚':'metal','辛':'metal','壬':'water','癸':'water'};
const YANG={'甲':1,'丙':1,'戊':1,'庚':1,'壬':1};
const EI={wood:0,fire:1,earth:2,metal:3,water:4};
const HIDE={'子':['癸'],'丑':['己','癸','辛'],'寅':['甲','丙','戊'],'卯':['乙'],'辰':['戊','乙','癸'],'巳':['丙','戊','庚'],'午':['丁','己'],'未':['己','丁','乙'],'申':['庚','壬','戊'],'酉':['辛'],'戌':['戊','辛','丁'],'亥':['壬','甲']};
let natal=null,pivot=null,dy=null,ln=null,ec=null;
const call=(o,n,...a)=>{try{return typeof o[n]==='function'?o[n](...a):''}catch{return''}};
const cls=g=>EL[g]||'earth';
function page(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===id))}
document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>page(x.dataset.page));
document.getElementById('city').onchange=e=>{if(e.target.value)document.getElementById('lng').value=e.target.value};
function ss(day,target){const r=(EI[EL[target]]-EI[EL[day]]+5)%5,s=!!YANG[day]===!!YANG[target];return r===0?(s?'比肩':'劫財'):r===1?(s?'食神':'傷官'):r===2?(s?'偏財':'正財'):r===3?(s?'七殺':'正官'):(s?'偏印':'正印')}
function typ(t){return['偏財','正財'].includes(t)?'wealth':['食神','傷官'].includes(t)?'output':['偏印','正印'].includes(t)?'resource':['比肩','劫財'].includes(t)?'peer':'officer'}
function hg(z){return HIDE[z]||[]}
function col(label,sub,gan,zhi,cs){return{label,sub,gan,zhi,cs}}
function pillar(c){const h=hg(c.zhi),t=ss(pivot,c.gan);return `<div class="pillar"><div class="p-top"><span class="gan ${cls(c.gan)} click" data-g="${c.gan}">${c.gan}</span><span class="ten ${typ(t)}">${t}</span></div><div class="p-bottom"><span class="zhi ${cls(c.zhi)}">${c.zhi}</span><span class="life">${c.cs||''}</span><div class="hiddens">${h.map(g=>`<span class="hgan ${cls(g)} click" data-g="${g}">${g}</span>`).join('')}</div><div class="h-tens">${h.map(g=>`<span class="${typ(ss(pivot,g))}">${ss(pivot,g)}</span>`).join('')}</div></div></div>`}
function draw(){if(!natal)return;const n=[natal.time,natal.day,natal.month,natal.year],t=[];if(dy)t.push(dy);if(ln)t.push(ln);document.getElementById('chart').innerHTML=`<div class="chart-scroll"><div class="heads"><div class="origin-h">原局</div>${t.map(x=>`<div class="trans-h">${x.label}<small>${x.sub}</small></div>`).join('')}</div><div class="board"><div class="origin">${n.map(pillar).join('')}</div>${t.map(x=>`<div class="trans">${pillar(x)}</div>`).join('')}</div></div><div class="legend">點天干或任何藏干，即以它作立極點重算全盤十神。</div>`;document.querySelectorAll('#chart .click').forEach(e=>e.onclick=()=>{pivot=e.dataset.g;draw();renderYun()})}
function mkDY(d,i){const q=call(d,'getGanZhi');const x=col('大運',`${call(d,'getStartYear')}–${call(d,'getEndYear')}`,q[0],q[1],call(d,'getZhiChangSheng')||call(d,'getChangSheng'));x.index=i;return x}
function mkLN(l){const q=call(l,'getGanZhi');return col('流年',String(call(l,'getYear')),q[0],q[1],call(l,'getZhiChangSheng')||call(l,'getChangSheng'))}
function renderYun(){if(!ec)return;const e=document.getElementById('yun');if(!e)return;const yun=ec.getYun(+document.getElementById('gender').value);const all=yun.getDaYun(10);const ls=all.filter((d,i)=>i>0&&call(d,'getGanZhi'));
const chips=ls.map((d,i)=>{const x=mkDY(d,i),a=call(d,'getStartAge'),b=call(d,'getEndAge');return `<button class="dy ${dy&&dy.index===i?'selected':''}" data-i="${i}"><div class="age">${a}–${b}歲</div><div class="gz"><span class="${cls(x.gan)}">${x.gan}</span><span class="${cls(x.zhi)}">${x.zhi}</span></div><div class="year">${x.sub}</div></button>`}).join('');
let panel='';if(dy){const d=ls[dy.index],a=d.getLiuNian().map(l=>{const x=mkLN(l),now=x.sub==new Date().getFullYear();return `<button class="ln ${ln&&ln.sub===x.sub?'selected':''} ${now?'now':''}" data-y="${x.sub}" data-g="${x.gan}" data-z="${x.zhi}"><div class="year">${x.sub}</div><div class="gz"><span>${x.gan}</span><span>${x.zhi}</span></div><div class="age">${call(l,'getAge')}歲</div></button>`}).join('');panel=`<div class="title">流年 · ${dy.gan}${dy.zhi}大運</div><div class="lngrid">${a}</div>`}
e.innerHTML=`<div class="title">大運及流年</div><div class="card"><div class="hint">第一步大運按月柱、性別及陰陽順逆推算；不顯示起運前的 Undefined 佔位項目。</div><div class="dybar">${chips}</div>${panel}</div>`;
e.querySelectorAll('.dy').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(dy&&dy.index===i){dy=null;ln=null}else{dy=mkDY(ls[i],i);ln=null}draw();renderYun()});
e.querySelectorAll('.ln').forEach(b=>b.onclick=()=>{if(ln&&ln.sub===b.dataset.y)ln=null;else ln=col('流年',b.dataset.y,b.dataset.g,b.dataset.z,'');draw();renderYun()})}
function eot(d){const n=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000),b=2*Math.PI*(n-81)/364;return 9.87*Math.sin(2*b)-7.53*Math.cos(b)-1.5*Math.sin(b)}
const JQ={DA_XUE:'大雪',DONG_ZHI:'冬至',XIAO_HAN:'小寒',DA_HAN:'大寒',LI_CHUN:'立春',YU_SHUI:'雨水',JING_ZHE:'驚蟄',CHUN_FEN:'春分',QING_MING:'清明',GU_YU:'穀雨',LI_XIA:'立夏',XIAO_MAN:'小滿',MANG_ZHONG:'芒種',XIA_ZHI:'夏至',XIAO_SHU:'小暑',DA_SHU:'大暑',LI_QIU:'立秋',CHU_SHU:'處暑',BAI_LU:'白露',QIU_FEN:'秋分',HAN_LU:'寒露',SHUANG_JIANG:'霜降',LI_DONG:'立冬',XIAO_XUE:'小雪'};
const RULE=[['甲','後','雨水',15],['甲','前','大雪',7],['乙','後','春分',15],['乙','後','清明',10],['乙','前','大暑',3],['丙','後','立春',7],['丙','後','小滿',15],['丁','後','小暑',12],['丁','前','霜降',8],['戊','前','雨水',8],['戊','後','穀雨',15],['戊','後','霜降',15],['戊','前','處暑',8],['己','前','夏至',7],['己','後','大暑',15],['己','後','大寒',15],['庚','後','立夏',7],['庚','後','處暑',15],['辛','後','秋分',15],['辛','後','寒露',7],['辛','前','大寒',8],['壬','後','立秋',7],['壬','後','立冬',15],['壬','後','冬至',15],['癸','前','穀雨',5],['癸','後','小雪',8],['癸','後','大雪',15]];
function jieqi(date){const y=date.getFullYear(),birth=date.getTime(),seen=new Set(),a=[];[y-1,y,y+1].forEach(Y=>{const t=Solar.fromYmd(Y,6,15).getLunar().getJieQiTable();Object.keys(t).forEach(k=>{const s=t[k].getSolar?t[k].getSolar():t[k],n=JQ[k]||k,tm=new Date(s.getYear(),s.getMonth()-1,s.getDay()).getTime(),key=n+'@'+tm;if(!seen.has(key)){seen.add(key);a.push({n,s,t:tm})}})});a.sort((x,z)=>x.t-z.t);let p,n;a.forEach(x=>{if(x.t<=birth)p=x;else if(!n)n=x});const aft=(birth-p.t)/86400000,bef=(n.t-birth)/86400000,r=[];RULE.forEach(x=>{if(x[1]=='後'&&p.n==x[2]&&aft>=0&&aft<x[3])r.push(x[0]);if(x[1]=='前'&&n.n==x[2]&&bef>0&&bef<=x[3])r.push(x[0])});if(p.n==='驚蟄'&&aft<15)r.push('甲','乙');if(p.n==='芒種'&&aft<8)r.push('丙','戊');if(p.n==='白露'&&aft<15)r.push('庚','辛');const gs=[...new Set(r)],start=Math.max(0,a.indexOf(p)-2),items=a.slice(start,start+6).map(x=>`<div class="jq"><span>${x.n}${x===p?'<i class="badge">上一節氣</i>':x===n?'<i class="badge">下一節氣</i>':''}</span><span class="jq-date">${x.s.toYmd()}</span></div>`).join('');return `<div class="title">五行所值節氣（林庚白）</div><div class="card season"><div class="row"><span>上一節氣</span><span>${p.n}</span></div><div class="row"><span>下一節氣</span><span>${n.n}</span></div><div class="row"><span>所值天干</span><span class="season-gans">${gs.length?gs.join('、'):'—'}</span></div><div class="hint">依據《人鑑》卷下「五行所值節氣一覽」。</div></div><div class="title">出生日前後節氣</div><div class="list">${items}</div>`}
function run(){try{const ds=document.getElementById('date').value,ts=document.getElementById('time').value,[y,m,d]=ds.split('-').map(Number),[h,mi]=ts.split(':').map(Number),raw=new Date(y,m-1,d,h,mi),off=document.getElementById('solar').checked?((+document.getElementById('lng').value-120)*4+eot(raw)):0,fd=new Date(raw.getTime()+off*60000),sol=Solar.fromYmdHms(fd.getFullYear(),fd.getMonth()+1,fd.getDate(),fd.getHours(),fd.getMinutes(),0),lu=sol.getLunar();ec=lu.getEightChar();const Y=ec.getYear(),M=ec.getMonth(),D=ec.getDay(),T=ec.getTime();natal={time:col('時柱','',T[0],T[1],call(ec,'getTimeDiShi')||call(ec,'getTimeZhiChangSheng')),day:col('日柱','',D[0],D[1],call(ec,'getDayDiShi')||call(ec,'getDayZhiChangSheng')),month:col('月柱','',M[0],M[1],call(ec,'getMonthDiShi')||call(ec,'getMonthZhiChangSheng')),year:col('年柱','',Y[0],Y[1],call(ec,'getYearDiShi')||call(ec,'getYearZhiChangSheng'))};pivot=D[0];dy=ln=null;document.getElementById('out').innerHTML=`<div class="tabs"><button class="active" data-t="basic">基本命盤</button><button data-t="advanced">進階資料</button></div><section class="panel active" id="basic"><div class="note">日本簡潔風格：留白、和紙色、細線排版。第一步大運已排除起運前的 Undefined 佔位項目。</div><div class="title">原局</div><div class="card"><div id="chart"></div></div><div id="yun"></div><div class="title">曆法資訊</div><div class="card"><div class="row"><span>農曆</span><span>${lu.toString()}</span></div><div class="row"><span>生肖</span><span>${lu.getYearShengXiao()}</span></div></div>${jieqi(fd)}</section><section class="panel" id="advanced"><div class="title">胎元及附加資料</div><div class="card"><div class="row"><span>胎元干支</span><span>${call(ec,'getTaiYuan')}</span></div><div class="row"><span>胎元納音</span><span>${call(ec,'getTaiYuanNaYin')}</span></div><div class="row"><span>命宮</span><span>${call(ec,'getMingGong')}</span></div><div class="row"><span>身宮</span><span>${call(ec,'getShenGong')}</span></div></div></section>`;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.t))});draw();renderYun()}catch(e){document.getElementById('out').innerHTML=`<div class="err">計算失敗：${e.message}</div>`}}
document.getElementById('calc').onclick=run;
['ry','rm','rd','rt'].forEach(id=>document.getElementById(id).innerHTML=GZ.map(x=>`<option>${x}</option>`).join(''));
